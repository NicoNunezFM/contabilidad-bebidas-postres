name: Verificación de Abadion POS

on:
  pull_request:
  push:
    branches:
      - feature/abadion-pos-integracion-contable

permissions:
  contents: read

jobs:
  sqlite-ficticio:
    runs-on: ubuntu-latest
    env:
      PYTHON_DOTENV_DISABLED: "1"
      NEGOCIO_DB_PATH: ${{ runner.temp }}/abadion-ci-ficticio.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: node --check whatsapp-bot/index.js
