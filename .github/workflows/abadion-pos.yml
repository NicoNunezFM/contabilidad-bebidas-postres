name: Verificación de Abadion POS

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'stable/**'
      - 'consolidate/**'
      - feature/abadion-pos-integracion-contable
      - feature/abadion-pos-cierre-diario
      - feature/abadion-pos-integracion-definitiva

permissions:
  contents: read

concurrency:
  group: abadion-pos-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sqlite-ficticio:
    runs-on: ubuntu-latest
    env:
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -r requirements-tablet-test.txt
      - name: Verificar inventario y procedencia de la consolidación
        run: python -B scripts/auditar_consolidacion.py --verificar
      - name: Verificar contratos de autenticación y permisos de endpoints
        run: python -B scripts/auditar_endpoints.py
      - run: python -m pytest -q -ra --junitxml=resultados-linux.xml
        env:
          NEGOCIO_DB_PATH: ${{ runner.temp }}/abadion-ci-ficticio.db
      - run: node --check whatsapp-bot/index.js
      - name: Conservar las identidades de los 692 casos de referencia
        if: always()
        run: python scripts/verificar_referencia_pruebas.py resultados-linux.xml --salida referencia-linux.json
      - name: Publicar resultados de Python y SQLite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abadion-resultados-linux
          path: |
            resultados-linux.xml
            referencia-linux.json
          if-no-files-found: warn
      - name: Publicar conciliación de jornada ficticia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abadion-conciliacion-jornada-linux
          path: .audit-artifacts/jornada-financiera.json
          include-hidden-files: true
          if-no-files-found: warn

  seguridad-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - name: Avisos de dependencias Python (sin excepciones silenciadas)
        run: python -m pip_audit -r requirements-tablet-test.txt --format json --output dependencias-python.json --progress-spinner off
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abadion-seguridad-python
          path: dependencias-python.json

  seguridad-node-inspeccion:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspeccionar lock del bot sin instalarlo ni modificarlo
        run: python scripts/auditar_dependencias_node.py --salida dependencias-node.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abadion-seguridad-node-pendiente
          path: dependencias-node.json
  pos-edge:
    runs-on: windows-latest
    env:
      PYTHON_DOTENV_DISABLED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-tablet-test.txt
      - name: Verificar suite completa, candidata bloqueada y POS ficticio en Edge
        shell: pwsh
        run: |
          $env:NEGOCIO_DB_PATH = Join-Path $env:RUNNER_TEMP 'abadion-edge-ficticio.db'
          $env:POS_TEST_BROWSER = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path -LiteralPath $env:POS_TEST_BROWSER)) {
            throw 'No se encontró Microsoft Edge.'
          }
          $env:POS_UI_CAPTURAS = Join-Path $env:RUNNER_TEMP 'abadion-capturas'
          python -m pytest -q -ra --junitxml=resultados-windows-edge.xml
      - name: Comprobar los 692 casos y ausencia de omisiones en Windows y Edge
        if: always()
        run: python scripts/verificar_referencia_pruebas.py resultados-windows-edge.xml --windows-edge --salida referencia-windows.json
      - name: Publicar resultados completos de Windows y Edge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abadion-resultados-windows-edge
          path: |
            resultados-windows-edge.xml
            referencia-windows.json
          if-no-files-found: warn
      - name: Publicar conciliación de jornada ficticia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abadion-conciliacion-jornada-windows
          path: .audit-artifacts/jornada-financiera.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Publicar capturas del flujo de ventas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abadion-preproduccion-edge
          path: ${{ runner.temp }}/abadion-capturas/*.png
          if-no-files-found: warn
