<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Demo táctil del punto de venta Abadion POS para Lo de Clau.">
<title>Abadion POS · Lo de Clau</title>
<style>
:root {
  color-scheme: light;
  --ink: #111c2e;
  --muted: #4d5a70;
  --line: #d5dce7;
  --paper: #f9fafc;
  --gold: #b27408;
  --gold-button: linear-gradient(170deg, #ffedc1, #f4ca72 55%, #d99a28);
  --shadow: 0 5px 12px rgba(18, 38, 70, .10);
}
* {box-sizing: border-box}
[hidden] {display: none !important}
body {
  margin: 0;
  background: radial-gradient(ellipse at 22% 0, #fafbfd 0%, #eef1f7 47%, #e6ebf4 100%);
  color: #111c2e;
  color: var(--ink);
  font: 16px "Segoe UI", Arial, sans-serif;
}
h1, h2, h3, p {margin: 0}
h2 {font-size: 22px; letter-spacing: -.02em}
h3 {font-size: 16px}
button, input {font: inherit}
button {
  min-height: 44px;
  padding: 7px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #f9fafc;
  background: var(--paper);
  color: inherit;
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
}
button:disabled {opacity: .55; cursor: default}
a:focus, button:focus, input:focus, textarea:focus, select:focus, summary:focus {
  outline: 3px solid #a26a0b;
  outline-offset: 2px;
}
svg.ui-icon {
  display: inline-block;
  width: 22px;
  height: 22px;
  vertical-align: middle;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  flex: none;
}
.workspace {display: flex; min-height: 100vh}
.desktop {flex: 1; min-width: 0}
.sidebar {
  position: sticky;
  top: 0;
  flex: 0 0 150px;
  height: 100vh;
  overflow: auto;
  display: flex;
  flex-direction: column;
  padding: 18px 8px 10px;
  background: linear-gradient(137deg, transparent 42px, #d99d34 43px, transparent 44px) no-repeat,
              linear-gradient(315deg, transparent 54px, #d99d34 55px, transparent 57px) no-repeat,
              linear-gradient(153deg, #10243e, #09182c 65%, #102b4c);
  color: #fff;
}
.system-brand {display: block; text-align: center; padding: 10px 5px 25px}
.system-brand img {display: block; width: 100%; max-width: 128px; height: 94px; object-fit: contain; margin: 0 auto}
.sidebar .nav-link {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 57px;
  margin: 0 0 5px;
  padding: 6px;
  border: 1px solid transparent;
  border-radius: 14px;
  background: transparent;
  color: #fff;
  text-align: center;
  text-decoration: none;
  font-size: 14px;
  line-height: 1.25;
}
.sidebar .nav-link .ui-icon {margin-bottom: 4px; width: 24px; height: 24px}
.sidebar .current {
  min-height: 68px;
  border-color: #f8cb68;
  background: linear-gradient(145deg, rgba(249, 212, 133, .28), rgba(207, 143, 40, .13));
  color: #fff5da;
}
.sidebar .current .ui-icon {color: #ffde93}
.sidebar .nav-link:hover {background-color: rgba(255, 255, 255, .08)}
.sidebar .nav-link:focus {outline-color: #ffdc8b}
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  max-width: 1680px;
  margin: auto;
  padding: 22px 24px 16px;
}
.page-title {position: relative; padding: 0 12px 0 18px}
.page-title:before {
  content: "";
  position: absolute;
  top: 4px;
  bottom: 3px;
  left: 0;
  width: 5px;
  border-radius: 4px;
  background: linear-gradient(#f5b947, #ac6e08);
}
.page-title h1 {font-size: 40px; line-height: 1.06; letter-spacing: -.045em}
.page-title p {margin-top: 3px; color: var(--muted)}
.top-tools {display: flex; flex: 0 1 460px; min-width: 0; align-items: center; margin: 6px 0}
.search-box {position: relative; flex: 1; min-width: 0}
.search-box .ui-icon {position: absolute; left: 13px; top: 12px; pointer-events: none}
.search-box input {
  display: block;
  width: 100%;
  height: 46px;
  padding: 8px 13px 8px 43px;
  border: 1px solid #b4bfd2;
  border-radius: 24px;
  background: rgba(255, 255, 255, .65);
  color: inherit;
}
#adminAccess {
  flex: none;
  max-width: 50%;
  margin-left: 8px;
  border-radius: 24px;
  background: #f9fafc;
  background: var(--paper);
  box-shadow: var(--shadow);
  font-size: 13px;
  overflow-wrap: anywhere;
}
#adminAccess .ui-icon {margin-right: 4px}
.top .demo {
  flex: none;
  margin-left: 7px;
  padding: 5px 7px;
  border-radius: 10px;
  background: #edf1f7;
  color: #43516a;
  font-size: 12px;
  font-weight: 600;
}
@media (max-width: 400px) {
  .top .demo {font-size: 11px}
  .search-box input {padding-left: 34px}
  .search-box .ui-icon {left: 8px}
}
.simulation-banner {padding: 7px 24px; background: #fff0cd; color: #65440a; font-weight: 600}
.layout {
  display: flex;
  align-items: flex-start;
  margin: auto;
  padding: 8px 14px 24px;
  max-width: 1680px;
}
.menu {flex: 1; min-width: 0}
.order {
  position: sticky;
  top: 12px;
  flex: 0 0 38%;
  min-width: 290px;
  margin-left: 14px;
  padding: 15px;
  border: 1px solid #e1e6ef;
  border-radius: 21px;
  background: #f9fafc;
  background: var(--paper);
  box-shadow: 0 11px 24px rgba(18, 38, 70, .12);
}
.operations {margin: 0 0 8px}
#catalogMode {min-height: 44px; margin: 0 0 8px; font-size: 13px}
.tabs, .cards, .payments, .actions {display: flex; flex-wrap: wrap}
.tabs {
  flex-wrap: nowrap;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding: 8px 4px;
  margin: 0 0 5px;
  border-radius: 17px;
  background: rgba(255, 255, 255, .64);
}
.tabs button {
  flex: 1 0 auto;
  margin: 0 4px 4px;
  padding: 7px 10px;
  min-height: 66px;
  font-size: 14px;
  white-space: nowrap;
  border-radius: 14px;
  background: linear-gradient(#fafbfd, #eef1f7);
  box-shadow: 0 2px 5px rgba(18, 38, 70, .12);
}
.tabs button:focus {outline-offset: -4px}
.tabs .icon {display: block; margin-bottom: 4px}
.tabs .ui-icon {width: 28px; height: 28px}
.tabs .active {
  background: linear-gradient(#203750, #09192d);
  color: white;
  border-color: #dea128;
  box-shadow: inset 0 0 0 1px #dea128, 0 3px 7px rgba(18, 38, 70, .18);
}
.tabs .active .icon {color: #ffda82}
.catalog-head, .catalog-head > div, .row-head, .order-heading, .total, .split, .card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.catalog-head {margin: 10px 4px 6px}
.product-count {
  margin-left: 7px;
  padding: 3px 7px;
  border-radius: 12px;
  background: #edf1f7;
  color: #44516a;
  font-size: 12px;
  white-space: nowrap;
}
.cards {margin: 0 -5px}
.card {
  display: flex;
  flex-direction: column;
  flex: 0 0 calc(33.333% - 10px);
  min-width: 0;
  margin: 5px;
  overflow: hidden;
  border: 1px solid #e1e6ef;
  border-radius: 16px;
  background: #f9fafc;
  background: var(--paper);
  box-shadow: var(--shadow);
}
.product-image {display: block; width: 100%; height: 150px; height: clamp(115px, 12vw, 192px); object-fit: cover}
.placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at top, #2d4764, #102139 78%);
  color: #ffe1a1;
  font-size: 36px;
}
.placeholder .ui-icon {width: 45px; height: 45px; stroke-width: 1.2}
#cardsReal .product-image {height: 82px}
.card-body {display: flex; flex-direction: column; flex: 1; padding: 10px}
.card h3 {font-size: 19px; letter-spacing: -.025em; overflow-wrap: anywhere}
.ingredients {margin: 4px 0 9px; color: #4d5a70; color: var(--muted); font-size: 13px; line-height: 1.35}
.card-foot {flex-wrap: wrap; margin-top: auto}
.price {font-size: 17px; font-weight: 750; margin: 4px 4px 4px 0; overflow-wrap: anywhere}
.card-foot button, .primary, #checkout {
  border-color: #d29a38;
  background: #f4ca72;
  background: var(--gold-button);
  color: #211500;
}
.card-foot button {font-size: 13px}
.offer {margin-top: 12px; padding: 10px; border-radius: 12px; background: #edf1f7}
.offer button, .actions button {margin: 5px 5px 0 0}
#apiStatus {margin: 10px 4px}
#clearCart {font-size: 13px; white-space: nowrap}
.order h2 .ui-icon {margin-right: 5px}
.order-heading {justify-content: flex-start; flex-wrap: wrap}
.row {padding: 8px; border-bottom: 1px solid #e1e6ef}
.row:last-child {border-bottom: 0}
.row-head > strong:first-child {min-width: 0; padding-right: 8px; overflow-wrap: anywhere}
.row-head > strong:last-child, .total strong, .split strong {white-space: nowrap}
.row button {margin: 4px 5px 0 0; font-size: 13px}
.lines {max-height: 31vh; overflow: auto; margin: 9px 0 12px; border: 1px solid #e1e6ef; border-radius: 11px}
.empty {padding: 12px}
.muted {color: #4d5a70; color: var(--muted); font-size: 14px}
.split {padding: 9px 2px; border-bottom: 1px solid #e1e6ef; font-size: 14px}
.split .ui-icon {margin-right: 5px; color: var(--gold)}
.total {padding: 10px 0; font-weight: 750}
.order-total {margin: 10px 0 14px; padding: 10px 12px; border-radius: 11px; background: linear-gradient(130deg, #fff2d5, #f2d39c)}
.order-total strong {font-size: 28px; letter-spacing: -.035em}
.payments {margin: 3px -3px 9px}
.payments button {flex: 1 1 auto; margin: 3px; min-height: 49px; padding: 6px; font-size: 13px}
.payments .ui-icon {display: block; margin: 0 auto 3px}
.active {background: #fff0d1; border-color: #c58b23; color: #332208}
.wide {width: 100%}
#checkout {min-height: 56px; margin-top: 7px; font-size: 18px; box-shadow: var(--shadow)}
#guardarPedidoAnonimo {margin-bottom: 6px}
.notice {margin-top: 6px; color: #205e42; font-size: 14px}
.notice:empty {display: none}
.overlay {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  background: rgba(9, 23, 42, .68);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  z-index: 2;
}
.dialog {
  width: 100%;
  max-width: 560px;
  max-height: 94vh;
  overflow: auto;
  padding: 18px;
  border-radius: 17px;
  background: #f9fafc;
  background: var(--paper);
}
.dialog h3 {margin: 15px 0 5px}
.check {display: flex; align-items: center; min-height: 49px; padding: 4px; border-bottom: 1px solid var(--line)}
.check input[type=checkbox] {width: 24px; height: 24px; margin-right: 12px; flex: none; accent-color: #a26a0b}
.setting {justify-content: space-between}
.setting input {width: 104px; min-height: 46px; padding: 6px}
.dialog label {display: block; margin: 10px 0 4px}
.dialog input:not([type=checkbox]), .dialog textarea, .dialog select {
  display: block;
  width: 100%;
  padding: 8px;
  font: inherit;
}
.dialog select {min-height: 44px}
.filaPagoPos {min-width: 0; border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; padding: 8px}
.filaPagoPos button, .dialog details, .dialog .actions {margin-top: 8px}
#camposOperacionPos > p, #errorOperacionPos, #errorVentaPos {margin: 8px 0}
.dialog summary {cursor: pointer}
.dialog .row p {margin-top: 4px; overflow-wrap: anywhere}
@media (max-width: 1190px) {
  .sidebar {flex-basis: 120px}
  .top-tools {flex-basis: 380px}
}
@media (max-width: 930px) {
  .card {flex-basis: calc(50% - 10px)}
}
@media (max-width: 740px) {
  .workspace {display: block}
  .sidebar {position: static; height: auto; padding: 6px 9px}
  .system-brand {display: flex; align-items: center; padding: 0}
  .system-brand img {width: 76px; height: 51px; margin: 0}
  .sidebar .operations {display: flex; overflow-x: auto; margin: 0}
  .sidebar .nav-link {flex: 0 0 auto; width: auto; min-height: 48px; margin: 4px; padding: 7px 10px; white-space: nowrap}
  .sidebar .nav-link .ui-icon {margin-bottom: 2px}
  .top {padding: 10px}
  .top-tools {flex: 1 0 100%; margin-bottom: 0}
  .page-title h1 {font-size: 29px}
  .page-title p {font-size: 14px}
  .layout {display: block; padding: 6px 10px 16px}
  .order {position: static; min-width: 0; margin: 12px 0 0}
  .lines {max-height: none}
}
</style>
<style>
.menu-selector {display:grid; gap:.6rem; margin:.75rem 0}
.menu-selector label {display:grid; gap:.3rem; font-weight:600}
.menu-selector select, .menu-selector textarea, .menu-selector input[type=number] {
  box-sizing:border-box; min-height:44px; width:100%; font:inherit; padding:.45rem;
  border:1px solid #aaa; border-radius:.5rem; color:#202020; background:#fff;
}
.menu-selector textarea {min-height:5rem; resize:vertical}
.menu-selector .extra-preparacion {grid-template-columns:1fr 5rem; align-items:center}
</style>

<script id="abadion-tablet-detector">
/* Small, standalone script: compatible with legacy Android browsers. */
(function () {
  var agent = navigator.userAgent || '';
  if (/Android/i.test(agent) || /(?:^|[?&])tablet=1(?:&|$)/.test(location.search)) {
    document.documentElement.className += ' tablet-mode';
  }
}());
</script>
<style id="abadion-tablet-layout">
.tablet-cart-toggle{display:none}
.tablet-cart-state {position: absolute; left: -9999px; width: 1px; height: 1px}
.tablet-show-catalog {display: none}
@media (max-width:1100px) {
  html.tablet-mode .workspace {display: block}
  html.tablet-mode .sidebar {position: static; height: auto; padding: 5px 10px}
  html.tablet-mode .system-brand {display: flex; align-items: center; padding: 0}
  html.tablet-mode .system-brand img {width: 76px; height: 50px; margin: 0}
  html.tablet-mode .sidebar .operations {display: flex; overflow-x: auto; margin: 0; -webkit-overflow-scrolling: touch}
  html.tablet-mode .sidebar .nav-link {
    flex: 0 0 auto;
    flex-direction: row;
    width: auto;
    min-height: 44px;
    margin: 3px;
    padding: 5px 9px;
    white-space: nowrap;
  }
  html.tablet-mode .sidebar .nav-link .ui-icon {width: 20px; height: 20px; margin: 0 5px 0 0}
  html.tablet-mode .top {padding: 8px 10px}
  html.tablet-mode .page-title h1 {font-size: 28px}
  html.tablet-mode .page-title p {font-size: 13px}
  html.tablet-mode .layout {display: block; padding: 6px 10px 78px}
  html.tablet-mode .order {display: none; position: static; min-width: 0; margin: 0}
  html.tablet-mode #tabletCartState:checked ~ .order{display:block}
  html.tablet-mode #tabletCartState:checked ~ .menu{display:none}
  html.tablet-mode .tablet-cart-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    position: fixed;
    z-index: 1;
    bottom: 8px;
    left: 10px;
    width: calc(100% - 20px);
    min-height: 54px;
    padding: 4px 8px;
    border: 1px solid #ebb84e;
    border-radius: 12px;
    background: #f4ca72;
    background: var(--gold-button);
    box-shadow: 0 5px 17px rgba(18, 38, 70, .25);
    color: #211500;
    font-weight: 750;
    text-align: center;
    cursor: pointer;
    touch-action: manipulation;
  }
  html.tablet-mode .tablet-cart-toggle .ui-icon {margin-right: 6px}
  html.tablet-mode #tabletCartState:checked ~ .tablet-cart-toggle .tablet-show-cart {display: none}
  html.tablet-mode #tabletCartState:checked ~ .tablet-cart-toggle .tablet-show-catalog {display: inline}
  html.tablet-mode .tablet-cart-state:focus ~ .tablet-cart-toggle {outline: 3px solid #a26a0b; outline-offset: 2px}
  html.tablet-mode .tabs button {min-height: 56px}
  html.tablet-mode .card-foot button, html.tablet-mode .payments button {min-height: 50px}
  html.tablet-mode .product-image {height: 104px}
  html.tablet-mode .dialog {max-width: 720px; max-height: calc(100vh - 12px); padding: 12px}
  html.tablet-mode .overlay {padding: 6px}
  html.tablet-mode .lines {max-height: none}
}
@media (min-width: 760px) and (max-width: 1100px) {
  html.tablet-mode .card {flex-basis: calc(33.333% - 10px)}
}
@media (max-width: 390px) {
  .card-foot button {width: 100%}
  .order-total strong {font-size: 24px}
  .order-heading h2 {font-size: 18px}
}
</style>
</head>

function mostrarCategoriasReales() {
  var contenedor = el('tabsReal');
  contenedor.innerHTML = '';

  var categorias = ['Todas'].concat(
    Array.from(new Set(
      productosReales.map(function (producto) {
        return producto.categoria || 'Sin categoría';
      })
    )).sort(function (a, b) {
      return a.localeCompare(b, 'es');
    })
  );

  categorias.forEach(function (nombre) {
    var boton = document.createElement('button');

    boton.type = 'button';
    var icono = document.createElement('span');
    icono.className = 'icon';
    icono.innerHTML = iconoCategoriaPos(nombre);
    boton.append(icono, document.createTextNode(nombre));

    var activo = nombre === categoriaReal;
    boton.classList.toggle('active', activo);
    boton.setAttribute('aria-pressed', String(activo));

    boton.onclick = function () {
      categoriaReal = nombre;

      contenedor.querySelectorAll('button').forEach(
        function (otroBoton) {
          var seleccionado = otroBoton === boton;

          otroBoton.classList.toggle(
            'active', seleccionado
          );

          otroBoton.setAttribute(
            'aria-pressed', String(seleccionado)
          );
        }
      );

      mostrarCatalogoReal();
    };

    contenedor.appendChild(boton);
  });
}
  

function productoDisponible(producto) {
  return producto.estado_entrenamiento !== 'sin_stock' &&
    (!producto.estado_entrenamiento || !producto.controla_stock || producto.stock > 0) &&
    Number.isFinite(producto.precio_venta) && producto.precio_venta > 0;
}

function elegirVarianteReal(producto, indicePedido) {
  if (!producto.familia_menu) {
    personalizarProductoReal(producto, indicePedido);
    return;
  }
  const variantes = productosReales.filter(actual => actual.familia_menu === producto.familia_menu);
  const atributos = Object.keys(producto.variante_menu);
  const elegidos = {...producto.variante_menu};
  el('dialogBody').onchange = null;
  show(producto.familia_menu, '<div id="selectoresMenu" class="menu-selector"></div>' +
    '<p id="estadoVariante" role="status"></p>', 'Continuar');
  const campos = el('selectoresMenu');
  const continuar = el('accept');
  const selectores = atributos.map(atributo => {
    const etiqueta = document.createElement('label');
    const selector = document.createElement('select');
    etiqueta.append(atributo, selector);
    campos.append(etiqueta);
    selector.onchange = () => {
      elegidos[atributo] = selector.value;
      actualizar();
    };
    return selector;
  });

  function actualizar() {
    let candidatas = variantes;
    atributos.forEach((atributo, indice) => {
      const selector = selectores[indice];
      const valores = [...new Set(candidatas.map(variante => variante.variante_menu[atributo]))];
      const opciones = valores.map(valor => {
        const disponible = candidatas.some(variante => variante.variante_menu[atributo] === valor &&
          productoDisponible(variante));
        const opcion = new Option(disponible ? valor : valor + ' · No disponible', valor);
        opcion.disabled = !disponible;
        return opcion;
      });
      if (!valores.includes(elegidos[atributo])) elegidos[atributo] = opciones.find(opcion => !opcion.disabled)?.value || valores[0];
      selector.replaceChildren(...opciones);
      selector.value = elegidos[atributo];
      candidatas = candidatas.filter(variante => variante.variante_menu[atributo] === selector.value);
    });
    const elegida = candidatas[0];
    continuar.disabled = !productoDisponible(elegida);
    const precio = Number.isFinite(elegida.precio_venta) ? money(elegida.precio_venta) : 'Precio pendiente';
    el('estadoVariante').textContent = continuar.disabled ? precio + ' · No disponible' : precio;
    continuar.onclick = () => personalizarProductoReal(elegida, indicePedido);
  }
  actualizar();
  selectores[0].focus();
}

  if (permiteDobles) {
    const etiqueta = document.createElement('label');
    porcion = document.createElement('select');
    porcion.append(new Option('Normales · incluidas', 'normal'),
      new Option('Dobles · +' + money(menu.papas_dobles_centavos / 100), 'doble'));
    porcion.value = anterior?.papas_dobles ? 'doble' : 'normal';
    etiqueta.append('Porción de papas fritas', porcion);
    panel.append(etiqueta);
  }
  for (const [destino, preparacion] of Object.entries(menu.destinos)) {
    const titulo = document.createElement('h3');
    titulo.textContent = 'Adicionales en ' + preparacion.toLowerCase();
    panel.append(titulo);
    for (const extra of menu.adicionales) {
      const etiqueta = document.createElement('label');
      etiqueta.className = 'extra-preparacion';
      const campo = document.createElement('input');
      campo.type = 'number';
      campo.min = '0';
      campo.max = '30';
      campo.inputMode = 'numeric';
      campo.dataset.tipo = extra.tipo;
      campo.dataset.destino = destino;
      campo.value = guardados.find(guardado => guardado.tipo === extra.tipo &&
        guardado.destino === destino)?.cantidad || 0;
      const nombre = extra.nombre + ' (' + preparacion + ')';
      campo.setAttribute('aria-label', nombre);
      etiqueta.append(nombre + ' · +' + money(extra.precio_centavos / 100), campo);
      panel.append(etiqueta);
      cantidades.push({campo, extra, destino});
    }
  }
  const etiqueta = document.createElement('label');
  const nota = document.createElement('textarea');
  nota.id = 'observacionMenu';
  nota.maxLength = 300;
  nota.value = anterior?.observacion || '';
  etiqueta.append('Observación para cocina (opcional)', nota);
  panel.append(etiqueta);
  contenedor.append(panel);

  const dobles = () => porcion?.value === 'doble';
  const cantidad = campo => campo.validity.valid ? Number(campo.value) : 0;
  return {
    perdioOpciones: (anterior?.papas_dobles && !permiteDobles) ||
      guardados.some(extra => !(extra.destino in menu.destinos)),
    valido: () => cantidades.every(({campo}) => campo.reportValidity()),
    recargo: () => cantidades.reduce((suma, {campo, extra}) =>
      suma + cantidad(campo) * extra.precio_centavos, dobles() ? menu.papas_dobles_centavos : 0),
    datos: () => ({
      guarnicion: permiteDobles ? (dobles() ? 'Papas fritas dobles' : 'Papas fritas normales') : menu.guarnicion,
      papas_dobles: dobles(),
      observacion: nota.value.trim(),
      adicionales_preparacion: cantidades.filter(({campo}) => cantidad(campo) > 0)
        .map(({campo, destino, extra}) => ({
          tipo: extra.tipo, destino, cantidad: cantidad(campo), nombre: extra.nombre,
          preparacion: menu.destinos[destino]
        }))
    })
  };
}

function personalizarProductoReal(producto, indicePedido) {
  // Si nos pasan un índice, editamos una línea existente.
  // Sin índice, agregamos una línea nueva al pedido de prueba.
  var editandoReal = Number.isInteger(indicePedido);
  var itemExistente = editandoReal ? pedidoReal[indicePedido] : null;

  if (editandoReal && (
    !itemExistente ||
    (Number(itemExistente.id_producto) !== Number(producto.id_producto) &&
      (!producto.familia_menu || itemExistente.familia_menu !== producto.familia_menu))
  )) {
    alert('No se encontró el producto para editarlo.');
    return;
  }

  var precioBase = producto.precio_venta;
  var numeroSolicitud = ++solicitudPersonalizacionReal;

  if (!productoDisponible(producto)) {
    alert('Este producto no está disponible.');
    return;
  }

  el('dialogBody').onchange = null;

  show(
    (editandoReal ? 'Editar: ' : 'Personalizar: ') + producto.nombre,
    '<p id="estadoPersonalizacion" role="status">' +
    'Cargando opciones...</p>' +
    '<div id="opcionesReales"></div>' +
    '<p id="totalPersonalizado"></p>',
    editandoReal ? 'Guardar cambios' : 'Agregar al pedido de prueba'
  );

  el('accept').disabled = true;

  fetch(
    '/pos-api/catalogo/productos/' +
    producto.id_producto + '/personalizaciones',
    {
      credentials: 'same-origin',
      cache: 'no-store'
    }
  )
    .then(function (respuesta) {
      if (!respuesta.ok) {
        throw new Error('No se pudieron consultar las opciones');
      }

      return respuesta.json();
    })
    .then(function (datos) {
      var contenedor = el('opcionesReales');

      // Ignorar respuestas de una ventana cerrada o de una solicitud anterior.
      if (!contenedor || overlay.hidden ||
          numeroSolicitud !== solicitudPersonalizacionReal) return;

      if (!Array.isArray(datos.ingredientes) ||
          !Array.isArray(datos.adicionales)) {
        throw new Error('Configuración inválida');
      }

      el('estadoPersonalizacion').textContent =
        'Precio base: ' + money(precioBase);

      const menu = datos.menu;
      if (menu) {
        datos.ingredientes = Array.from(new Map(
          [...datos.ingredientes, ...menu.ingredientes].map(nombre => [nombre.toLowerCase(), nombre])
        ).values());
      }

      if (editandoReal) {
        var aclaracion = document.createElement('p');
        aclaracion.className = 'muted';
        aclaracion.textContent =
          'Los cambios se aplicarán a las ' + itemExistente.cantidad +
          ' unidades de esta línea. Los extras se calculan con los ' +
          'precios que devuelve el catálogo al editar.';
        contenedor.appendChild(aclaracion);
      }

      if (datos.ingredientes.length) {
        var titulo = document.createElement('h3');
        titulo.textContent = 'Quitar ingredientes';
        contenedor.appendChild(titulo);
      }

      datos.ingredientes.forEach(function (ingrediente) {
        var etiqueta = document.createElement('label');
        etiqueta.className = 'check';

        var casilla = document.createElement('input');
        casilla.type = 'checkbox';
        casilla.name = 'quitarReal';
        casilla.value = ingrediente;
        casilla.checked = Boolean(
          itemExistente &&
          itemExistente.ingredientes_quitados.includes(ingrediente)
        );

        etiqueta.appendChild(casilla);
        etiqueta.appendChild(
          document.createTextNode(' Sin ' + ingrediente)
        );

        contenedor.appendChild(etiqueta);
      });

      if (datos.adicionales.length) {
        var tituloExtras = document.createElement('h3');
        tituloExtras.textContent = 'Agregar extras';
        contenedor.appendChild(tituloExtras);
      }

      var extrasPorId = new Map();

      datos.adicionales.forEach(function (extra) {
        var precioExtra = extra.precio_venta;

        var valido = (
          typeof precioExtra === 'number' &&
          Number.isFinite(precioExtra) &&
          precioExtra >= 0
        );

        var etiqueta = document.createElement('label');
        etiqueta.className = 'check';

        var casilla = document.createElement('input');
        casilla.type = 'checkbox';
        casilla.name = 'extraReal';
        casilla.value = String(extra.id_adicional_catalogo);
        casilla.disabled = !valido;
        casilla.checked = valido && Boolean(
          itemExistente && itemExistente.adicionales.some(function (guardado) {
            return Number(guardado.id_adicional_catalogo) ===
                   Number(extra.id_adicional_catalogo);
          })
        );

        if (valido) {
          extrasPorId.set(
            extra.id_adicional_catalogo,
            extra
          );
        }

        etiqueta.appendChild(casilla);
        etiqueta.appendChild(
          document.createTextNode(
            ' ' + extra.nombre + ' · ' +
            (valido ? money(precioExtra) : 'Sin precio')
          )
        );

        contenedor.appendChild(etiqueta);
      });

      const opcionesMenu = menu ? mostrarOpcionesMenu(contenedor, menu, itemExistente) : null;

      if (itemExistente) {
        var ingredientesDisponibles = new Set(datos.ingredientes);
        var extrasDisponibles = new Set(
          datos.adicionales.filter(function (extra) {
            return typeof extra.precio_venta === 'number' &&
              Number.isFinite(extra.precio_venta) && extra.precio_venta >= 0;
          }).map(function (extra) {
            return Number(extra.id_adicional_catalogo);
          })
        );
        var opcionesNoDisponibles =
          itemExistente.ingredientes_quitados.some(function (nombre) {
            return !ingredientesDisponibles.has(nombre);
          }) || itemExistente.adicionales.some(function (extra) {
            return !extrasDisponibles.has(Number(extra.id_adicional_catalogo));
          }) || (opcionesMenu && opcionesMenu.perdioOpciones);

        if (opcionesNoDisponibles) {
          var advertencia = document.createElement('p');
          advertencia.className = 'muted';
          advertencia.setAttribute('role', 'status');
          advertencia.textContent =
            'Alguna opción anterior ya no está disponible. ' +
            'Si guardás, se eliminará de esta línea.';
          contenedor.appendChild(advertencia);
        }
      }

      function seleccionados(nombre) {
        return Array.from(
          contenedor.querySelectorAll(
            'input[name="' + nombre + '"]:checked'
          )
        );
      }

      function calcularTotal() {
        var total = precioBase + (opcionesMenu ? opcionesMenu.recargo() / 100 : 0);

        seleccionados('extraReal').forEach(function (casilla) {
          var extra = extrasPorId.get(Number(casilla.value));

          if (extra) {
            total += extra.precio_venta;
          }
        });

        el('totalPersonalizado').textContent =
          'Total por unidad: ' + money(total);

        return total;
      }

      el('dialogBody').onchange = calcularTotal;
      if (opcionesMenu) contenedor.oninput = calcularTotal;
      calcularTotal();

      el('accept').disabled = false;

      el('accept').onclick = function () {
        if (opcionesMenu && !opcionesMenu.valido()) return;
        var quitados = seleccionados('quitarReal').map(
          function (casilla) {
            return casilla.value;
          }
        );

        var adicionales = seleccionados('extraReal').map(
          function (casilla) {
            return extrasPorId.get(Number(casilla.value));
          }
        ).filter(Boolean);

        var itemActualizado = {
          id_producto: producto.id_producto,
          nombre: producto.nombre,
          familia_menu: producto.familia_menu,
          // Mantener la cantidad existente si estamos editando.
          cantidad: editandoReal ? itemExistente.cantidad : 1,
          categoria: producto.categoria,
          precio_base: precioBase,
          ingredientes_quitados: quitados,
          adicionales: adicionales.map(function (extra) {
            return {
              id_adicional_catalogo: extra.id_adicional_catalogo,
              nombre: extra.nombre,
              precio_venta: extra.precio_venta
            };
          }),
          total: calcularTotal(),
          ...(opcionesMenu ? opcionesMenu.datos() : {})
        };

        if (editandoReal) {
          pedidoReal[indicePedido] = itemActualizado;
        } else {
          pedidoReal.push(itemActualizado);
        }

        close();
        mostrarPedidoReal();
      };
    })
    .catch(function (error) {
      console.error(error);

      if (!overlay.hidden &&
          numeroSolicitud === solicitudPersonalizacionReal &&
          el('estadoPersonalizacion')) {
        el('estadoPersonalizacion').textContent =
          'No se pudieron cargar las opciones.';
      }
    });
}


function tarjetasCatalogo(productos) {
  const tarjetas = [];
  const familias = new Map();
  for (const producto of productos) {
    if (!producto.familia_menu) {
      tarjetas.push({producto});
    } else if (!familias.has(producto.familia_menu)) {
      const tarjeta = {producto, familia: producto.familia_menu};
      familias.set(tarjeta.familia, tarjeta);
      tarjetas.push(tarjeta);
    } else {
      const tarjeta = familias.get(producto.familia_menu);
      if (!productoDisponible(tarjeta.producto) && productoDisponible(producto)) tarjeta.producto = producto;
    }
  }
  return tarjetas;
}

function mostrarCatalogoReal() {
  var filtro = searchable(
    (el('search').value || '').trim()
  );

  var visibles = productosReales.filter(function (producto) {
    var texto = String(producto.nombre || '') + ' ' +
                String(producto.categoria || '') + ' ' + (producto.familia_menu || '') + ' ' +
                Object.values(producto.variante_menu || {}).join(' ');

    
    return (
      (categoriaReal === 'Todas' ||
      (producto.categoria || 'Sin categoría') === categoriaReal)
      &&
      searchable(texto).indexOf(filtro) !== -1
    );

  });

  var contenedor = el('cardsReal');
  contenedor.innerHTML = '';

  
  el('categoryTitle').textContent =
    categoriaReal === 'Todas'
      ? 'Todos los productos'
      : categoriaReal;


  const tarjetas = tarjetasCatalogo(visibles);
  el('productCount').textContent = tarjetas.length + ' de ' + tarjetasCatalogo(productosReales).length + ' productos';

  tarjetas.forEach(function ({producto, familia}) {
    var tarjeta = document.createElement('article');
    tarjeta.className = 'card';
    if (familia) tarjeta.dataset.familia = familia;

    var visual;
    if (familia === 'Hamburguesas') {
      visual = document.createElement('img');
      visual.className = 'product-image family-image';
      visual.src = photos[0];
      visual.alt = '';
    } else {
      visual = document.createElement('span');
      visual.className = 'product-image placeholder';
      visual.setAttribute('aria-hidden', 'true');
      visual.innerHTML = iconoCategoriaPos(producto.categoria);
    }

    var contenido = document.createElement('div');
    contenido.className = 'card-body';

    var nombre = document.createElement('h3');
    nombre.textContent = familia || producto.nombre;

    var categoria = document.createElement('p');
    categoria.className = 'ingredients';
    categoria.textContent = producto.categoria;

    var precio = document.createElement('strong');
    precio.className = 'price';

    precio.textContent =
      typeof producto.precio_venta === 'number'
        ? money(producto.precio_venta)
        : producto.estado_entrenamiento === 'disponible' ? 'Precio pendiente' : 'Sin precio configurado';

    var aviso = document.createElement('p');
    aviso.className = 'muted';
    
    if (producto.estado_entrenamiento === 'sin_stock' ||
        (producto.estado_entrenamiento && producto.controla_stock && producto.stock <= 0)) {
      aviso.textContent = 'SIN STOCK';
    } else if (producto.promo_postres_chicos) {
      aviso.textContent = 'Promo de a dos · $1.000 de descuento por par';
    } else {
      aviso.textContent = 'Pedido de prueba · Sin cobro real';
    }

    var botonAgregar = document.createElement('button');
    botonAgregar.type = 'button';
    botonAgregar.textContent = familia ? 'Elegir variante' : '+ Agregar';
    if (familia) {
      const disponibles = productosReales.filter(actual => actual.familia_menu === familia && productoDisponible(actual));
      precio.textContent = disponibles.length ? 'Desde ' + money(Math.min(...disponibles.map(actual => actual.precio_venta))) : '';
      aviso.textContent = disponibles.length ? '' : 'SIN STOCK';
    } else {
      botonAgregar.disabled = !productoDisponible(producto);
    }

    botonAgregar.onclick = function () {
      elegirVarianteReal(producto);
    };


    contenido.appendChild(nombre);
    if (!familia) contenido.appendChild(categoria);
    if (aviso.textContent) contenido.appendChild(aviso);

    var pie = document.createElement('div');
    pie.className = 'card-foot';
    pie.append(precio, botonAgregar);
    contenido.appendChild(pie);
    tarjeta.append(visual, contenido);
    contenedor.appendChild(tarjeta);
  });

  if (!visibles.length) {
    var vacio = document.createElement('p');
    vacio.className = 'muted';
    vacio.textContent = 'No se encontraron productos.';
    contenedor.appendChild(vacio);
  }
}

el('catalogMode').onclick = function () {
  var boton = el('catalogMode');

  // Volver al catálogo de demostración.
  if (modoReal) {
    modoReal = false;
    document.querySelector('.top .demo').textContent = 'Modo demo';

    el('tabs').hidden = false;
    el('tabsReal').hidden = true;
    el('cards').hidden = false;
    el('cardsReal').hidden = true;
    el('demoOffers').hidden = false;

    boton.textContent = simulacionActiva ? 'Ver catálogo de simulación' : 'Ver catálogo de SQLite';
    el('search').value = '';

    el('apiStatus').textContent =
      'Demostración local. Las operaciones de esta pantalla no se guardan.';

    menu();
    order();
    return;
  }

  // Cargar productos actuales desde SQLite.
  boton.disabled = true;

  fetch('/pos-api/catalogo/productos', {
    cache: 'no-store',
    credentials: 'same-origin'
  })
    .then(function (respuesta) {
      if (!respuesta.ok) {
        throw Object.assign(new Error('Error HTTP ' + respuesta.status), {status: respuesta.status});
      }

      return respuesta.json();
    })
    .then(function (datos) {
      if (!datos.ok || !Array.isArray(datos.productos)) {
        throw new Error('Catálogo inválido');
      }

      productosReales = datos.productos;
      modoReal = true;
      document.querySelector('.top .demo').textContent = simulacionActiva ? 'Simulación' : 'Catálogo SQLite';
      categoriaReal = 'Todas';
      el('tabsReal').hidden = false;
      mostrarCategoriasReales();

      el('tabs').hidden = true;
      el('cards').hidden = true;
      el('cardsReal').hidden = false;
      el('demoOffers').hidden = true;
      el('search').value = '';

      boton.textContent = 'Volver al catálogo demo';

      el('apiStatus').textContent = simulacionActiva
        ? 'Catálogo ficticio de simulación.'
        : 'Catálogo de SQLite. Podés validar pedidos de prueba.';

      mostrarCatalogoReal();
      order();
    })
    .catch(function (error) {
      el('apiStatus').textContent =
        error.status === 401
          ? 'Iniciá sesión para cargar el catálogo de SQLite.'
          : 'No se pudo cargar SQLite. El catálogo demo sigue disponible.';

      console.error(error);
    })
    .finally(function () {
      boton.disabled = Boolean(ventaPendiente);
    });
};


function indicacionesCocina(item) {
  const cambios = item.guarnicion ? [item.guarnicion] : [];
  cambios.push(...item.ingredientes_quitados.map(nombre => 'Sin ' + nombre.toLowerCase()));
  cambios.push(...item.adicionales.map(extra => '+ ' + extra.nombre));
  for (const extra of item.adicionales_preparacion || []) {
    cambios.push('+ ' + extra.cantidad + ' × ' + extra.nombre + ' en ' + extra.preparacion.toLowerCase());
  }
  if (item.observacion) cambios.push('Nota: ' + item.observacion);
  return cambios;
}

el('resumenCocina').onclick = function () {
  show('Pedido para cocina', '<ul id="lineasCocina"></ul>', 'Cerrar');
  for (const item of pedidoReal) {
    const linea = document.createElement('li');
    const nombre = document.createElement('strong');
    nombre.textContent = (item.cantidad || 1) + ' × ' + item.nombre;
    linea.append(nombre);

    if (cambios.length) {
      const detalle = document.createElement('p');
      detalle.textContent = cambios.join(' · ');
      linea.append(detalle);
    }
    el('lineasCocina').append(linea);

  el('cancel').hidden = true;
  el('accept').onclick = close;
};

function mostrarPedidoReal() {
  revisionPedidoReal++;
  validacionPos = null;
  el('estadoPedido').hidden = false;
  el('estadoPedido').textContent = ventaPendiente
    ? 'Venta pendiente de confirmación. Reintentá para obtener el resultado sin duplicarla.'
    : simulacionActiva && !sesionPos ? 'Iniciá sesión en el POS para validar y registrar ventas simuladas.' : '';
  var contenedor = el('lines');
  contenedor.innerHTML = '';
  el('resumenCocina').hidden = !pedidoReal.length || !productosReales.some(producto => producto.estado_entrenamiento);

  var totalRotiseria = 0;
  var totalPostresBebidas = 0;

  pedidoReal.forEach(function (item, indice) {
    // Calcular el subtotal antes de acumularlo en su caja.
    var cantidad = item.cantidad || 1;
    var subtotalLinea = item.total * cantidad;

    if (item.categoria === 'Bebidas' ||
        item.categoria === 'Postres') {
      totalPostresBebidas += subtotalLinea;
    } else {
      totalRotiseria += subtotalLinea;
    }


    var fila = document.createElement('div');
    fila.className = 'row';

    var encabezado = document.createElement('div');
    encabezado.className = 'row-head';

    var nombre = document.createElement('strong');
    
    nombre.textContent = item.nombre + ' × ' + cantidad;


    var precio = document.createElement('strong');
    
    precio.textContent = money(subtotalLinea);


    encabezado.appendChild(nombre);
    encabezado.appendChild(precio);
    fila.appendChild(encabezado);

    var cambios = indicacionesCocina(item);

    if (cambios.length) {
      var detalle = document.createElement('p');
      detalle.className = 'muted';
      detalle.textContent = cambios.join(' · ');
      fila.appendChild(detalle);
    }

    var botonEditar = document.createElement('button');
    botonEditar.type = 'button';
    botonEditar.textContent = 'Editar';
    botonEditar.setAttribute('aria-label',
      'Editar ' + item.nombre);
    botonEditar.onclick = function () {
      var producto = productosReales.find(function (actual) {
        return Number(actual.id_producto) === Number(item.id_producto);
      });

      if (!producto) {
        alert('El producto ya no figura en el catálogo cargado.');
        return;
      }
      elegirVarianteReal(producto, indice);
    };

    var quitar = document.createElement('button');
    quitar.type = 'button';
    quitar.textContent = 'Quitar';

    quitar.onclick = function () {
      pedidoReal.splice(indice, 1);
      mostrarPedidoReal();
    };

    var controlesCantidad = document.createElement('div');
    controlesCantidad.style.display = 'flex';
    controlesCantidad.style.gap = '8px';
    controlesCantidad.style.marginTop = '8px';

    var botonMenos = document.createElement('button');
    botonMenos.type = 'button';
    botonMenos.textContent = '− 1';
    botonMenos.disabled = cantidad <= 1;

    botonMenos.onclick = function () {
      if (item.cantidad > 1) {
        item.cantidad--;
        mostrarPedidoReal();
      }
    };

    var botonMas = document.createElement('button');
    botonMas.type = 'button';
    botonMas.textContent = '+ 1';
    botonMas.disabled = cantidad >= 99;

    botonMas.onclick = function () {
      if (item.cantidad < 99) {
        item.cantidad++;
        mostrarPedidoReal();
      }
    };

    controlesCantidad.appendChild(botonMenos);
    controlesCantidad.appendChild(botonMas);

    fila.appendChild(controlesCantidad);
    fila.appendChild(botonEditar);
    fila.appendChild(quitar);
    contenedor.appendChild(fila);
  });

  if (!pedidoReal.length) {
    var aviso = document.createElement('p');
    aviso.className = 'muted empty';
    aviso.textContent =
      'Seleccioná un producto real para armar el pedido de prueba.';
    contenedor.appendChild(aviso);
  }

  
  var cantidadTotal = pedidoReal.reduce(
    function (acumulado, item) {
      return acumulado + (item.cantidad || 1);
    },
    0
  );

  el('count').textContent =

  var sesionAdmin = false;

  async function consultarPos(ruta, opciones) {
    var respuesta = await fetch('/pos-api' + ruta, {
      credentials: 'same-origin', cache: 'no-store', signal: senalTiempoPos(12000),
      ...opciones
    });
    var datos = await respuesta.json();
    if (!respuesta.ok) {
      var detalle = datos.detail;
      var mensaje = typeof detalle === 'string' ? detalle : detalle && detalle.mensaje;
      var error = new Error(mensaje || 'Revisá los datos ingresados.');
      error.status = respuesta.status;
      error.codigo = detalle?.codigo || respuesta.headers.get('X-POS-Resultado');
      throw error;
    }
    return datos;
  }

  function enviarPos(ruta, datos, usuario) {
    var headers = {'Content-Type': 'application/json'};
    if (usuario) headers['X-POS-Usuario'] = usuario.id_usuario;
    return consultarPos(ruta, {method: 'POST', headers, body: JSON.stringify(datos)});
  }

  function clavePendiente(usuario) {
    return 'abadion-pos-venta-pendiente:' + usuario.id_usuario;
  }

  async function actualizarSesionPos() {
    var usuarioAnterior = sesionPos;
    try {
      sesionPos = (await consultarPos('/yo')).usuario;
    } catch (error) {
      sesionPos = null;
    }
    sesionAdmin = Boolean(sesionPos && sesionPos.rol === 'admin');
    el('adminAccessLabel').textContent = sesionPos
      ? 'Cerrar sesión (' + sesionPos.usuario + ')' : 'Iniciar sesión POS';
    el('adminPrices').hidden = !sesionAdmin;
    el('adminExtras').hidden = !sesionAdmin;
    el('clientesPos').hidden = !clientesActivos || !sesionPos;
    el('historialSimulado').hidden = !simulacionActiva || !sesionPos;
    el('seguimientoPos').hidden = !simulacionActiva || !sesionPos || !el('entrenamientoAviso');
    el('cajasSimuladas').hidden = !simulacionActiva || !sesionAdmin;
    el('contabilidadPos').hidden = !contabilidadActiva || !sesionAdmin;
    el('cajaDiariaPos').hidden = !cajaDiariaActiva || !sesionPos;

    if (usuarioAnterior && usuarioAnterior.id_usuario !== sesionPos?.id_usuario) {
      pedidoReal = [];
      medioSimulado = '';
      ventaPendiente = null;
      el('notice').textContent = '';
    }
    if (simulacionActiva && sesionPos && !ventaPendiente) {
      try {
        ventaPendiente = JSON.parse(sessionStorage.getItem(clavePendiente(sesionPos)));
      } catch (error) {
        el('notice').textContent = 'No se pudo recuperar la venta pendiente de esta pestaña.';
      }
      if (ventaPendiente) {
        pedidoReal = ventaPendiente.pedido;
        medioSimulado = ventaPendiente.datos.medio_pago;
        if (!modoReal) el('catalogMode').click();
      }
    }
    if (modoReal) mostrarPedidoReal();
  }

  el('adminAccess').onclick = async function () {
    if (enviandoVenta) return;
    if (sesionPos) {
      el('adminAccess').disabled = true;
      try {
        await enviarPos('/logout');
        await actualizarSesionPos();
      } catch (error) {
        el('notice').textContent = 'No se pudo cerrar la sesión.';
      } finally {
        el('adminAccess').disabled = false;
      }
      return;
    }

    el('dialogBody').onchange = null;
    show('Iniciar sesión POS',
      '<form id="formSesionPos"><label for="usuarioPos">Usuario</label>' +
      '<input id="usuarioPos" autocomplete="username" maxlength="40" required>' +
      '<label for="claveAdmin">Contraseña</label>' +
      '<input id="claveAdmin" type="password" autocomplete="current-password" maxlength="256" required>' +
      '<p id="errorAdmin" role="alert"></p></form>', 'Iniciar sesión');
    var formulario = el('formSesionPos');
    var boton = el('accept');
    boton.type = 'submit';
    boton.setAttribute('form', formulario.id);
    el('usuarioPos').focus();
    formulario.onsubmit = async function (evento) {
      evento.preventDefault();
      if (boton.disabled) return;
      boton.disabled = true;
      try {
        await enviarPos('/login', {usuario: el('usuarioPos').value.trim(), contrasena: el('claveAdmin').value});
        await actualizarSesionPos();
        // El laboratorio exige sesión también para cargar el catálogo ficticio.
        if (simulacionActiva && !modoReal) el('catalogMode').click();
        if (formulario.isConnected && !overlay.hidden) close();
      } catch (error) {
        if (formulario.isConnected) el('errorAdmin').textContent = error.status === 401
          ? error.message : 'No se pudo iniciar sesión. Reintentá.';
      } finally {
        boton.disabled = false;
      }
    };
  };


function configurarOpcionesProducto(producto) {
  if (!sesionAdmin) return;

  el('dialogBody').onchange = null;

  show(
    'Opciones: ' + producto.nombre,
    '<p id="estadoOpciones" class="muted" role="status">' +
    'Cargando configuración...</p>' +
    '<h3>Ingredientes que se pueden quitar</h3>' +
    '<p class="muted">Escribí un ingrediente por línea.</p>' +
    '<textarea id="ingredientesProducto" rows="5" ' +
    'style="width:100%;padding:10px;margin-top:8px" ' +
    'maxlength="2000"></textarea>' +
    '<h3>Extras permitidos</h3>' +
    '<div id="extrasProducto"></div>' +
    '<p id="errorOpciones" role="alert"></p>',
    'Guardar opciones'
  );

  var guardar = el('accept');
  guardar.disabled = true;

  function consultar(url) {
    return fetch(url, {
      credentials: 'same-origin',
      cache: 'no-store'
    }).then(function (respuesta) {
      if (!respuesta.ok) {
        throw new Error('Error HTTP ' + respuesta.status);
      }
      return respuesta.json();
    });
  }

  var ruta = '/pos-api/catalogo/productos/' +
    producto.id_producto + '/personalizaciones';

  Promise.all([
    consultar('/pos-api/admin/verificar'),
    consultar(ruta),
    consultar('/pos-api/catalogo/adicionales')
  ])
    .then(function (resultados) {
      if (!el('estadoOpciones')) return;

      var configuracion = resultados[1];
      var catalogoExtras = resultados[2];

      if (!Array.isArray(configuracion.ingredientes) ||
          !Array.isArray(configuracion.adicionales) ||
          !Array.isArray(catalogoExtras.adicionales)) {
        throw new Error('Respuesta inválida');
      }

      el('ingredientesProducto').value =
        configuracion.ingredientes.join('\n');

      var contenedor = el('extrasProducto');
      contenedor.innerHTML = '';

      var permitidos = new Set(
        configuracion.adicionales.map(function (extra) {
          return extra.id_adicional_catalogo;
        })
      );

      catalogoExtras.adicionales.forEach(function (extra) {
        var etiqueta = document.createElement('label');
        etiqueta.className = 'check';

        var casilla = document.createElement('input');
        casilla.type = 'checkbox';
        casilla.value = String(extra.id_adicional_catalogo);
        casilla.checked = permitidos.has(
          extra.id_adicional_catalogo
        );

        var precio = typeof extra.precio_venta === 'number'
          ? money(extra.precio_venta)
          : 'Sin precio configurado';

        etiqueta.appendChild(casilla);
        etiqueta.appendChild(
          document.createTextNode(
            ' ' + extra.nombre + ' · ' + precio
          )
        );

        contenedor.appendChild(etiqueta);
      });

      el('estadoOpciones').textContent =
        'Configuración de ' + producto.nombre;

      guardar.disabled = false;

      guardar.onclick = function () {
        var ingredientes = el('ingredientesProducto')
          .value.split(/\r?\n/)
          .map(function (nombre) {
            return nombre.trim();
          })
          .filter(Boolean);

        var nombresNormalizados = ingredientes.map(
          function (nombre) {
            return nombre.toLocaleLowerCase('es');
          }
        );

        if (
          ingredientes.length > 30 ||
          ingredientes.some(function (nombre) {
            return nombre.length > 60;
          }) ||
          new Set(nombresNormalizados).size !== ingredientes.length
        ) {
          el('errorOpciones').textContent =
            'Revisá los ingredientes: máximo 30, ' +
            'sin repetidos y hasta 60 caracteres por nombre.';
          return;
        }

        var idsAdicionales = Array.from(
          contenedor.querySelectorAll(
            'input[type="checkbox"]:checked'
          )
        ).map(function (casilla) {
          return Number(casilla.value);
        });

        if (idsAdicionales.length > 30) {
          el('errorOpciones').textContent =
            'Podés seleccionar hasta 30 extras.';
          return;
        }

        var confirmado = window.confirm(
          '¿Guardar la configuración de ' +
          producto.nombre + '?'
        );

        if (!confirmado) return;

        guardar.disabled = true;

        fetch(
          '/pos-api/admin/productos/' +
          producto.id_producto + '/personalizaciones',
          {
            method: 'PUT',
            credentials: 'same-origin',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              ingredientes: ingredientes,
              ids_adicionales: idsAdicionales
            })
          }
        )
          .then(function (respuesta) {
            if (!respuesta.ok) {
              throw new Error('Error HTTP ' + respuesta.status);
            }
            return respuesta.json();
          })
          .then(function (resultado) {
            if (!resultado.ok) {
              throw new Error('No se confirmó el guardado');
            }

            show(
              'Opciones guardadas',
              '<p id="mensajeOpciones" role="status"></p>',
              'Volver al listado'
            );

            el('mensajeOpciones').textContent =
              'Se guardaron ' +
              resultado.ingredientes.length +
              ' ingredientes y ' +
              resultado.ids_adicionales.length +
              ' extras para ' + resultado.producto + '.';

            el('accept').onclick = function () {
              el('adminPrices').click();
            };
          })
          .catch(function (error) {
            console.error(error);

            if (el('errorOpciones')) {
              el('errorOpciones').textContent =
                'No se pudo guardar. Revisá la conexión, ' +
                'los extras disponibles y tu sesión.';
            }

            if (el('accept')) {
              el('accept').disabled = false;
            }
          });
      };
    })
    .catch(function (error) {
      console.error(error);

      if (el('estadoOpciones')) {
        el('estadoOpciones').textContent =
          'No se pudo cargar la configuración. ' +
          'Comprobá tu sesión y la conexión.';
      }
    });
}

      }

          if (!sesionAdmin) return;

          el('dialogBody').onchange = null;

          var precioActual =
            typeof producto.precio_venta === 'number'
              ? money(producto.precio_venta)
              : 'Sin precio';

          show(
            'Editar precio: ' + producto.nombre,
            '<p class="muted">Precio actual: ' + precioActual + '</p>' +
            '<label for="precioNuevo">Nuevo precio ($)</label>' +

            'max="100000000" step="1" inputmode="numeric" ' +

            '<p id="errorPrecio" class="muted" role="alert"></p>',

          );

          el('precioNuevo').value =
            producto.precio_venta == null
              ? ''
              : producto.precio_venta;

          el('precioNuevo').focus();

          el('accept').onclick = function () {
            var campo = el('precioNuevo');

                valor <= 0 ||

              return;

              el('errorPrecio').textContent =

              return;

            fetch(

              producto.id_producto + '/precio',

                method: 'PATCH',
                credentials: 'same-origin',

                  'Content-Type': 'application/json'

                })
              }

                if (!respuesta.ok) {
                  throw new Error('HTTP ' + respuesta.status);

                  el('adminPrices').click();

                console.error(error);

                if (el('errorPrecio')) {
                  el('errorPrecio').textContent =
                    'No se pudo guardar el precio. ' +
                    'Comprobá la conexión y tu sesión.';
                }

                if (el('accept')) {
                  el('accept').disabled = false;
                }
              });
          };
        };

       
        fila.appendChild(botonEditar);

        botonOpciones.type = 'button';

      });

        'No se pudo abrir la administración. ' +
        'Comprobá que tu sesión siga activa.';

      console.error(error);
    });
};

      : extra.precio_venta;

  el('accept').onclick = function () {
    var valor = Number(campo.value);

    if (
      !campo.value.trim() ||
      !Number.isSafeInteger(valor) ||
      valor < 0 ||
      valor > 100000000
    ) {
      el('errorExtra').textContent =
        'Ingresá un precio válido en pesos enteros.';
      return;
    }

    if (valor === extra.precio_venta) {
      el('errorExtra').textContent =
        'El precio no cambió.';
      return;
    }

    var confirmado = window.confirm(
      '¿Confirmás cambiar el precio de ' +
      extra.nombre + ' de ' + precioActual +
      ' a ' + money(valor) + '?'
    );

    if (!confirmado) return;

    var guardar = el('accept');
    guardar.disabled = true;

    fetch(
      '/pos-api/admin/adicionales/' +
      extra.id_adicional_catalogo + '/precio',
      {
        method: 'PATCH',
        credentials: 'same-origin',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          precio_nuevo: valor
        })
      }
    )
      .then(function (respuesta) {
        if (!respuesta.ok) {
          throw new Error('Error HTTP ' + respuesta.status);
        }

        return respuesta.json();
      })
      .then(function (resultado) {
        if (!resultado.ok) {
          throw new Error('No se pudo actualizar el precio');
        }

        show(
          'Precio actualizado',
          '<p id="confirmacionExtra" role="status"></p>',
          'Volver a extras'
        );

        el('confirmacionExtra').textContent =
          extra.nombre + ': ' + money(valor) +
          '. Precio guardado correctamente.';

        el('accept').onclick = function () {
          el('adminExtras').click();
        };
      })
      .catch(function (error) {
        console.error(error);

        if (el('errorExtra')) {
          el('errorExtra').textContent =
            'No se pudo guardar el precio. ' +
            'Revisá la conexión y los permisos.';
        }

        }

  };

  function paginarPos(contenedor, ruta, campo, renderizar, vacio) {
    var lista = nodoPos('div');
    var estado = nodoPos('p', '', 'muted');
    estado.setAttribute('role', 'status');
    var mas = nodoPos('button', 'Cargar más');
    mas.hidden = true;
    contenedor.append(lista, estado, mas);
    var cursor = null;
    async function cargar() {
      mas.disabled = true;
      estado.textContent = 'Cargando…';
      var separador = ruta.includes('?') ? '&' : '?';
      var url = cursor ? ruta + separador + 'antes_de=' + cursor : ruta;
      try {
        var datos = await consultarPos(url);
        datos[campo].forEach(fila => lista.append(renderizar(fila)));
        cursor = datos.siguiente_antes_de;
        mas.hidden = !cursor;
        estado.textContent = lista.childElementCount ? '' : vacio;
        if (mas.hidden && document.activeElement === mas) el('accept').focus();
      } catch (error) {
        estado.textContent = error.status ? error.message : 'No se pudo cargar la consulta.';
        mas.textContent = 'Reintentar consulta';
        mas.hidden = false;
        return;
      } finally {
        mas.disabled = false;
      }
      mas.textContent = 'Cargar más';
    }
    mas.onclick = cargar;
    void cargar();
  }

  var modalidadesSimuladas = {...mediosSimulados, combinado: 'Pago combinado', fiado: 'Pendiente / Fiado'};
  var tiposEventoPos = {venta: 'Venta', abono: 'Abono', anulacion: 'Anulación',
    devolucion: 'Devolución', transferencia_interna: 'Transferencia interna'};

  function nombreReceptorPos(receptor) {
    var caja = receptor.startsWith('comidas_') ? 'comidas' : 'bebidas_postres';
    var tipo = {efectivo: 'Caja de efectivo', efectivo_en_transito: 'Efectivo en tránsito', banco: 'Cuenta bancaria', mercado_pago: 'Cuenta Mercado Pago'};
    return nombresCajas[caja] + ' · ' + tipo[receptor.slice(caja.length + 1)];
  }

  function selectorPos(etiqueta, opciones) {
    var label = nodoPos('label', etiqueta + ' ');
    var select = nodoPos('select');
    for (var [valor, nombre] of Object.entries(opciones)) select.add(new Option(nombre, valor));
    label.append(select);
    return {label, select};
  }

  function receptoresPos(medio) {
    var receptores = {};
    for (var caja of Object.keys(nombresCajas)) {
      var tipos = medio === 'efectivo' ? ['efectivo'] : medio ? ['banco', 'mercado_pago']
        : ['efectivo', 'banco', 'mercado_pago'];
      for (var tipo of tipos) {
        var receptor = caja + '_' + tipo;
        receptores[receptor] = nombreReceptorPos(receptor);
      }
    }
    if (el('entrenamientoAviso') && (!medio || medio === 'efectivo')) {
      for (const caja of Object.keys(nombresCajas)) {
        const receptor = caja + '_efectivo_en_transito';
        receptores[receptor] = nombreReceptorPos(receptor);
      }
    }
    return receptores;
  }

  function leerCentavosPos(valor, permiteCero = false) {
    var partes = /^(\d+)(?:[,.](\d{1,2}))?$/.exec(valor.trim());
    var centavos = partes ? Number(partes[1]) * 100 + Number((partes[2] || '').padEnd(2, '0')) : NaN;
    if (!Number.isSafeInteger(centavos) || (!permiteCero && centavos === 0)) {
      throw new Error(permiteCero ? 'Ingresá un importe con hasta dos decimales.'
        : 'Ingresá un importe positivo con hasta dos decimales.');
    }
    return centavos;
  }

  function importeEntradaPos(etiqueta) {
    var label = nodoPos('label', etiqueta + ' ');
    var input = nodoPos('input');
    input.inputMode = 'decimal';
    input.maxLength = 18;
    label.append(input);
    return {label, input};
  }

  function editarPagosPos(contenedor, importeInicial, actualizar, filasIniciales = 1) {
    var filas = nodoPos('div');
    var agregar = nodoPos('button', 'Agregar pago');
    agregar.type = 'button';
    contenedor.append(filas, agregar);

    function agregarFila(importe) {
      if (filas.children.length >= 20) return;
      var fila = nodoPos('fieldset');
      fila.className = 'filaPagoPos';
      fila.append(nodoPos('legend', 'Pago'));
      var medio = selectorPos('Medio', mediosSimulados);
      var receptor = selectorPos('Receptor', receptoresPos(medio.select.value));
      medio.select.onchange = function () {
        receptor.select.replaceChildren(...Object.entries(receptoresPos(medio.select.value))
          .map(([valor, nombre]) => new Option(nombre, valor)));
      };
      var monto = importeEntradaPos('Importe en pesos');
      monto.input.dataset.importePago = '';
      if (importe) monto.input.value = (importe / 100).toFixed(2);
      var referencia = nodoPos('label', 'Referencia del pago (opcional) ');
      var texto = nodoPos('input');
      texto.maxLength = 120;
      texto.dataset.referenciaPago = '';
      referencia.append(texto);
      var quitar = nodoPos('button', 'Quitar pago');
      quitar.type = 'button';
      quitar.onclick = function () {
        fila.remove();
        agregar.disabled = false;
        actualizar?.();
        agregar.focus();
      };
      fila.append(medio.label, receptor.label, monto.label, referencia, quitar);
      filas.append(fila);
      agregar.disabled = filas.children.length === 20;
      actualizar?.();
    }

    agregar.onclick = function () {
      agregarFila();
      filas.lastElementChild.querySelector('select').focus();
    };
    filas.addEventListener('input', () => actualizar?.());
    for (var i = 0; i < filasIniciales; i++) agregarFila(i === 0 ? importeInicial : 0);
    return function () {
      return Array.from(filas.children, fila => {
        var [medio, receptor] = fila.querySelectorAll('select');
        return {medio_pago: medio.value, receptor: receptor.value,
          importe_centavos: leerCentavosPos(fila.querySelector('[data-importe-pago]').value),
          referencia: fila.querySelector('[data-referencia-pago]').value.trim() || null};
      });
    };
  }

  function claveOperacionPos(ruta, usuario) {
    return 'abadion-pos-operacion:' + usuario.id_usuario + ':' + ruta;
  }

  function hayOperacionPos(ruta, usuario) {
    try { return Boolean(sessionStorage.getItem(claveOperacionPos(ruta, usuario))); }
    catch (error) { return false; }
  }

  function abrirOperacionPos(titulo, ruta, usuario, preparar, alCompletar) {
    el('dialogBody').onchange = null;
    show(titulo, '<div id="camposOperacionPos"></div><p id="errorOperacionPos" role="alert"></p>', 'Confirmar');
    var campos = el('camposOperacionPos');
    var errorEl = el('errorOperacionPos');
    var boton = el('accept');
    var clave = claveOperacionPos(ruta, usuario);
    var datos;
    try {
      datos = JSON.parse(sessionStorage.getItem(clave));
    } catch (error) {
      errorEl.textContent = 'No se pudo recuperar la confirmación guardada.';
      boton.disabled = true;
      return;
    }
    var leer;
    if (datos) campos.append(nodoPos('p', 'Hay una confirmación pendiente. Reintentá para consultar el resultado.'));
    else leer = preparar(campos);
    boton.onclick = async function () {
      if (boton.disabled || sesionPos !== usuario) return;
      boton.disabled = true;
      try {
        if (!datos) {
          var nuevos = {...leer(), id_solicitud: uuidPos()};
          sessionStorage.setItem(clave, JSON.stringify(nuevos));
          datos = nuevos;
        }
        var resultado = await enviarPos(ruta, datos, usuario);
        sessionStorage.removeItem(clave);
        if (campos.isConnected && !overlay.hidden) alCompletar(resultado);
      } catch (error) {
        if (datos && [404, 409, 422].includes(error.status) && error.codigo !== 'SESION_CAMBIADA') {
          sessionStorage.removeItem(clave);
          datos = null;
          if (!leer) {
            campos.replaceChildren();
            leer = preparar(campos);
          }
        }
        errorEl.textContent = datos ? 'Confirmación pendiente. Usá el mismo botón para reintentar.' : error.message;
      } finally {
        boton.disabled = false;
      }
    };
  }

  function motivoOperacionPos(campos, opcional = false) {
    var label = nodoPos('label', opcional ? 'Motivo (obligatorio si hay diferencia) ' : 'Motivo ');
    var input = nodoPos('textarea');
    input.maxLength = 300;
    label.append(input);
    campos.append(label);
    return function () {
      if (!opcional && !input.value.trim()) throw new Error('Ingresá un motivo.');
      return input.value.trim() || null;
    };
  }

  function abrirAbonoPos(venta, usuario) {
    abrirOperacionPos('Abonar venta #' + venta.id_venta, '/simulacion/ventas/' + venta.id_venta + '/abonos',
      usuario, function (campos) {
        campos.append(nodoPos('p', 'Saldo pendiente ' + importePos(venta.saldo_pendiente_centavos)));
        var leer = editarPagosPos(campos, venta.saldo_pendiente_centavos);
        return function () {
          var pagos = leer();
          if (!pagos.length) throw new Error('Agregá al menos un pago.');
          if (pagos.reduce((total, pago) => total + pago.importe_centavos, 0) > venta.saldo_pendiente_centavos) {
            throw new Error('El abono supera el saldo pendiente.');
          }
          return {pagos};
        };
      }, () => mostrarHistorialPos('Abono registrado en la venta #' + venta.id_venta + '.'));

  function abrirDevolucionPos(venta, usuario) {
    abrirOperacionPos('Devolver productos · Venta #' + venta.id_venta, '/simulacion/ventas/' + venta.id_venta + '/devoluciones',
      usuario, function (campos) {
        var unidades = [];
        venta.items.forEach(function (item, indice) {
          var linea = indice + 1;
          var maximo = item.cantidad - (venta.unidades_devueltas[linea] || 0);
          if (!maximo) return;
          var label = nodoPos('label', item.producto + ' · hasta ' + maximo + ' ');
          var cantidad = nodoPos('input');
          cantidad.type = 'number';
          cantidad.min = 0;
          cantidad.max = maximo;
          cantidad.value = 0;
          label.append(cantidad);
          campos.append(label);
          unidades.push({linea, maximo, cantidad});
        });
        var motivo = motivoOperacionPos(campos);
        return function () {
          var items = [];
          for (var unidad of unidades) {
            var cantidad = Number(unidad.cantidad.value);
            if (!Number.isInteger(cantidad) || cantidad < 0 || cantidad > unidad.maximo) {
              throw new Error('Revisá las cantidades a devolver.');
            }
            if (cantidad) items.push({linea: unidad.linea, cantidad});
          }
          if (!items.length) throw new Error('Ingresá las unidades a devolver.');
          return {motivo: motivo(), items};
        };
      }, function () {
        void refrescarStockPos();
        mostrarHistorialPos('Devolución registrada en la venta #' + venta.id_venta + '.');

      venta => filaVentaPos(venta, usuario, confirmarAnulacionPos), 'Todavía no hay ventas simuladas.');

  function confirmarAnulacionPos(venta, usuario) {
    if (sesionPos !== usuario || usuario.rol !== 'admin') return;
    el('dialogBody').onchange = null;
    show('Anular venta simulada #' + venta.id_venta,
      '<p>Se revertirán el stock y los movimientos de caja ficticios de esta venta.</p>' +
      '<form id="formAnulacionPos"><label for="motivoAnulacion">Motivo de la anulación</label>' +
      '<textarea id="motivoAnulacion" rows="3" maxlength="300" required></textarea>' +
      '<p id="errorAnulacionPos" role="alert"></p></form>', 'Confirmar anulación');
    var formulario = el('formAnulacionPos');
    var boton = el('accept');
    boton.type = 'submit';
    boton.setAttribute('form', formulario.id);
    el('cancel').textContent = 'Volver al historial';
    el('cancel').onclick = function (evento) {
      evento.stopPropagation();
      mostrarHistorialPos();
    };
    el('motivoAnulacion').focus();
    var datos;
    formulario.onsubmit = async function (evento) {
      evento.preventDefault();
      if (boton.disabled || sesionPos !== usuario) return;
      var motivo = el('motivoAnulacion').value.trim();
      if (!motivo) {
        el('errorAnulacionPos').textContent = 'Ingresá un motivo.';
        return;
      }
      boton.disabled = true;
      try {
        datos ||= {motivo, id_solicitud: uuidPos()};
        await enviarPos('/simulacion/ventas/' + venta.id_venta + '/anulacion', datos, usuario);
        if (formulario.isConnected && !overlay.hidden) {
          mostrarHistorialPos('Se anuló la venta simulada #' + venta.id_venta + '.');
        }
        void refrescarStockPos();
      } catch (error) {
        if (formulario.isConnected && !overlay.hidden) {
          el('errorAnulacionPos').textContent = error.status ? error.message
            : 'Confirmación pendiente. Usá el mismo botón para reintentar o consultá el historial.';
          if ([404, 409, 422].includes(error.status)) datos = null;
        }
      } finally {
        boton.disabled = false;
      }
    };
  }

  const estadosPedidoPos = {
    pendiente: 'Pendiente', preparacion: 'En preparación', listo: 'Listo',

  function filaSeguimientoPos(pedido, usuario) {
    const fila = nodoPos('details');
    fila.append(nodoPos('summary', '#' + pedido.id_pedido + ' · ' + estadosPedidoPos[pedido.estado]
      + ' · ' + (pedido.origen === 'whatsapp' ? 'WhatsApp' : 'Mostrador')
      + ' · ' + (pedido.modalidad === 'envio' ? 'Envío' : 'Retiro')));
    if (pedido.id_venta === null) fila.append(nodoPos('p', 'Sin venta · Estimado '
      + importePos(pedido.total_estimado_centavos)));
    if ((pedido.id_venta === null && pedido.estado !== 'cancelado')
      || hayOperacionPos('/simulacion/pedidos/' + pedido.id_pedido + '/venta', usuario)) {
      const convertir = nodoPos('button', 'Confirmar venta del pedido');
      convertir.onclick = () => void prepararConversionPos(pedido, usuario);
      fila.append(convertir);
    }
    const estadoCobro = pedido.estado_cobro === 'sin_venta' ? 'Sin registrar' : pedido.estado_cobro;
    fila.append(nodoPos('p', fechaPos(pedido.fecha) + ' · Cobro: ' + estadoCobro
      + ' · Saldo ' + importePos(pedido.saldo_pendiente_centavos)));
    for (const linea of pedido.items) {
      fila.append(nodoPos('p', linea.cantidad + ' × ' + linea.producto
        + (linea.observacion ? ' · ' + linea.observacion : '')));
    }
    for (const dato of [pedido.direccion, pedido.referencias, pedido.observacion]) {
      if (dato) fila.append(nodoPos('p', dato));
    }
    if (pedido.envio) fila.append(nodoPos('p', 'Envío para ' + pedido.envio.titular
      + ' · ' + importePos(pedido.envio.importe_centavos)));
    if (pedido.saldo_reparto_centavos > 0) fila.append(nodoPos('p', 'Pendiente del envío al repartidor · '
      + importePos(pedido.saldo_reparto_centavos)));
    const historial = nodoPos('details');
    historial.append(nodoPos('summary', 'Historial de estados'));
    for (const paso of pedido.historial) {
      historial.append(nodoPos('p', fechaPos(paso.fecha) + ' · ' + estadosPedidoPos[paso.estado]
        + ' · Usuario #' + paso.id_usuario + (paso.motivo ? ' · ' + paso.motivo : '')));
    }
    fila.append(historial);
    const siguiente = {
      pendiente: 'preparacion', preparacion: 'listo',
      listo: pedido.modalidad === 'envio' ? 'en_camino' : 'entregado', en_camino: 'entregado'
    }[pedido.estado];
    if (siguiente) {
      for (const estado of [siguiente, ...(usuario.rol === 'admin' ? ['cancelado'] : [])]) {
        const accion = nodoPos('button', estado === 'cancelado' ? 'Cancelar pedido' : estadosPedidoPos[estado]);
        accion.onclick = () => abrirOperacionPos(estadosPedidoPos[estado] + ' · Pedido #' + pedido.id_pedido,
          '/simulacion/pedidos/' + pedido.id_pedido + '/estado', usuario, campos => {
            const motivo = estado === 'cancelado' ? motivoOperacionPos(campos) : null;
            if (motivo) campos.append(nodoPos('p', 'La cancelación operativa conserva la venta y sus cobros.'));
            const saldoEntrega = (pedido.id_venta === null ? pedido.total_estimado_centavos
              : pedido.saldo_pendiente_centavos) + pedido.saldo_reparto_centavos;
            const confirmar = estado === 'entregado' && saldoEntrega > 0;
            if (confirmar) campos.append(nodoPos('p', 'Confirmá la entrega con saldo pendiente de '
              + importePos(saldoEntrega) + '.'));
            return () => ({estado, version: pedido.version, confirmar_pendiente: confirmar,
              saldo_confirmado_centavos: confirmar ? saldoEntrega : null,
              motivo: motivo ? motivo() : null});
          }, () => mostrarSeguimientoPos());
        fila.append(accion);
      }

    return fila;

  var rutaCajaDiaria = '/simulacion/caja-diaria';
  var nombresCajaDiaria = {comidas: 'Rotisería / Comidas', bebidas_postres: 'Bebidas y Postres'};
  var tiposCajaDiaria = {
    apertura: 'Apertura', cobro: 'Cobros', reembolso: 'Reembolsos', transferencia: 'Transferencias netas',
    gasto: 'Gastos en efectivo', retiro: 'Retiros', aporte: 'Aportes', arqueo: 'Arqueo', cierre: 'Cierre',
  };

    var boton = nodoPos('button', texto);

    boton.onclick = accion;

  function momentoCajaDiaria(evento) {

  function describirArqueo(arqueo) {
    var valores = arqueo.resultado;
    return 'Contado ' + importePos(valores.contado_centavos) + ' · Diferencia '
      + importePos(valores.diferencia_centavos) + ' · ' + arqueo.usuario;

  function resumenJornada(jornada) {
    var cuerpo = nodoPos('div');
    cuerpo.append(nodoPos('p', jornada.fecha + ' · ' + (jornada.cerrada ? 'Cerrada' : 'Abierta')));
    cuerpo.append(nodoPos('p', 'Efectivo esperado ' + importePos(jornada.esperado_centavos)));

      cuerpo.append(nodoPos('p', describirArqueo(jornada.arqueo)));
      if (jornada.arqueo.motivo) cuerpo.append(nodoPos('p', 'Motivo: ' + jornada.arqueo.motivo));
      if (!jornada.arqueo_vigente) cuerpo.append(nodoPos('p', 'Hubo movimientos después del arqueo. Volvé a contar.'));
    }
    if (jornada.cierre) {
      cuerpo.append(nodoPos('p', 'Cerró ' + jornada.cierre.usuario + ' · ' + momentoCajaDiaria(jornada.cierre)));
    }

  function mostrarHistorialCajaDiaria(caja, jornada) {
    var ruta = rutaCajaDiaria + '/' + caja + '/historial';
    var cuerpo = abrirConsultaPos(nombresCajaDiaria[caja] + ' · ' + (jornada ? 'Auditoría' : 'Historial'));
    cuerpo.append(botonCajaDiaria('Volver', () => jornada ? mostrarHistorialCajaDiaria(caja) : mostrarCajaDiaria()));
    if (jornada) {
      paginarPos(cuerpo, ruta + '/' + jornada.id_jornada, 'eventos', function (evento) {
        var fila = nodoPos('article', undefined, 'row');
        fila.append(nodoPos('strong', tiposCajaDiaria[evento.tipo] + ' · ' + momentoCajaDiaria(evento)));
        fila.append(nodoPos('p', evento.usuario + ' · ' + evento.rol
          + (evento.importe_centavos === null ? '' : ' · ' + importePos(evento.importe_centavos))));
        if (evento.tipo === 'arqueo') fila.append(nodoPos('p', describirArqueo(evento)));
        if (evento.motivo) fila.append(nodoPos('p', evento.motivo));
