    } else {
      paginarPos(cuerpo, ruta, 'jornadas', function (fila) {
        var resumen = resumenJornada(fila);
        resumen.append(botonCajaDiaria('Ver auditoría del ' + fila.fecha, () => mostrarHistorialCajaDiaria(caja, fila)));
        return resumen;
      }, 'Todavía no hay jornadas.');
    }
  }

  function accionesJornada(seccion, caja, jornada, fecha, usuario) {
    var nombre = nombresCajaDiaria[caja];
    var id = jornada?.id_jornada;
    var abierta = id && !jornada.cerrada;
    var admin = usuario.rol === 'admin';
    function accion(texto, endpoint, habilitada, preparar, mensaje) {
      var ruta = rutaCajaDiaria + '/' + caja + '/' + endpoint;
      var pendiente = hayOperacionPos(ruta, usuario);
      if (habilitada || pendiente) seccion.append(botonCajaDiaria(pendiente ? 'Reintentar · ' + texto : texto, () => {
        abrirOperacionPos(texto + ' · ' + nombre, ruta, usuario, habilitada ? preparar : campos => {
          campos.append(botonCajaDiaria('Actualizar caja diaria', () => mostrarCajaDiaria()));
          return () => { throw new Error('Actualizá el estado de la caja.'); };
        }, () => mostrarCajaDiaria(mensaje));
      }));
    }
    accion('Abrir caja', 'apertura', !jornada, campos => {
      var importe = importeCajaDiaria(campos, 'Efectivo inicial en pesos');
      return () => ({fecha, inicial_centavos: importe(true)});
    }, 'Caja abierta.');
    accion('Guardar arqueo', 'arqueo', abierta, campos => {
      campos.append(nodoPos('p', 'Efectivo esperado ' + importePos(jornada.esperado_centavos)));
      var importe = importeCajaDiaria(campos, 'Efectivo contado en pesos');
      var motivo = motivoOperacionPos(campos, true);
      return () => ({id_jornada: id, revision_efectivo: jornada.revision_efectivo,
        contado_centavos: importe(true), motivo: motivo()});
    }, 'Arqueo registrado.');
    var requiereAdmin = jornada?.arqueo?.resultado.diferencia_centavos !== 0;
    var listo = abierta && jornada.arqueo_vigente;
    if (listo && requiereAdmin && !admin) {
      seccion.append(nodoPos('p', 'Administración debe autorizar el cierre con diferencia.'));
    }
    accion('Cerrar caja', 'cierre', listo && (!requiereAdmin || admin), campos => {
      campos.append(nodoPos('p', describirArqueo(jornada.arqueo)));
      if (requiereAdmin) campos.append(nodoPos('p', 'Al confirmar autorizás el cierre con esta diferencia.'));
      return () => ({id_jornada: id, id_arqueo: jornada.arqueo.id_evento});
    }, 'Caja cerrada.');
    accion('Registrar gasto, retiro o aporte', 'movimientos', abierta && jornada.fecha === fecha && admin, campos => {
      var tipo = selectorPos('Movimiento', {gasto: 'Gasto pagado en efectivo', retiro: 'Retiro', aporte: 'Aporte'});
      campos.append(tipo.label);
      var importe = importeCajaDiaria(campos, 'Importe en pesos');
      var motivo = motivoOperacionPos(campos);
      return () => ({id_jornada: id, tipo: tipo.select.value, importe_centavos: importe(), motivo: motivo()});
    }, 'Movimiento registrado.');
  }

  async function mostrarCajaDiaria(mensaje) {
    var usuario = sesionPos;
    if (!cajaDiariaActiva || !usuario) return;
    var cuerpo = abrirConsultaPos('Caja diaria · Simulación');
    var estado = nodoPos('p', 'Cargando cajas…');
    estado.setAttribute('role', 'status');
    cuerpo.append(estado);
    try {
      var datos = await consultarPos(rutaCajaDiaria);
      if (!cuerpo.isConnected || overlay.hidden || sesionPos !== usuario) return;
      estado.textContent = (mensaje ? mensaje + ' ' : '') + 'Fecha en Argentina ' + datos.fecha_local;
      cuerpo.append(botonCajaDiaria('Actualizar', () => mostrarCajaDiaria()));
      for (const [caja, nombre] of Object.entries(nombresCajaDiaria)) {
        var jornada = datos.cajas[caja];
        var seccion = nodoPos('section', undefined, 'row');
        seccion.dataset.cajaDiaria = caja;
        seccion.append(nodoPos('h3', nombre));
        if (jornada) {
          seccion.append(resumenJornada(jornada));
          var movimientos = nodoPos('details');
          var totales = nodoPos('ul');
          for (var [tipo, importe] of Object.entries(jornada.movimientos_centavos)) {
            totales.append(nodoPos('li', tiposCajaDiaria[tipo] + ' · ' + importePos(importe)));
          }
          movimientos.append(nodoPos('summary', 'Totales de efectivo'), totales);
          seccion.append(movimientos);
        } else {
          seccion.append(nodoPos('p', 'Pendiente de apertura.'));
        }
        accionesJornada(seccion, caja, jornada, datos.fecha_local, usuario);
        seccion.append(botonCajaDiaria('Ver historial', () => mostrarHistorialCajaDiaria(caja)));
        cuerpo.append(seccion);
      }
      if (usuario.rol === 'admin') {
        cuerpo.append(botonCajaDiaria('Distribuir efectivo entre cajas', () => abrirTransferenciaPos(usuario, true)));
      }
    } catch (error) {
      estado.textContent = error.status ? error.message : 'No se pudo cargar la caja diaria.';
      cuerpo.append(botonCajaDiaria('Reintentar', () => mostrarCajaDiaria()));
    }
  }

      var acciones = nodoPos('div', undefined, 'actions');
      var transferir = nodoPos('button', 'Registrar transferencia interna');
      transferir.onclick = () => abrirTransferenciaPos(sesionPos);
      var cerrar = nodoPos('button', 'Cerrar período ' + datos.periodo_abierto);
      cerrar.onclick = () => abrirCierrePos(sesionPos, datos.periodo_abierto);

  function importePos(centavos) {
    return '$ ' + (centavos / 100).toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  }

  function actualizarPedidoSimulado() {
    var pendiente = Boolean(ventaPendiente);
    el('validarPedido').hidden = pendiente;
    el('guardarPedidoAnonimo').hidden = !el('entrenamientoAviso') || !simulacionActiva || !sesionPos
      || pendiente || (!validacionPos && !hayOperacionPos('/simulacion/pedidos', sesionPos));
    el('validarPedido').disabled = !pedidoReal.length || (simulacionActiva && !sesionPos)
      || validandoRevision === revisionPedidoReal;
    el('paymentSection').hidden = !simulacionActiva;
    el('payments').replaceChildren();
    if (simulacionActiva) {
      Object.entries(modalidadesSimuladas).forEach(function ([clave, etiqueta]) {
        var opcion = document.createElement('button');
        opcion.innerHTML = iconoPagoPos(etiqueta);
        opcion.appendChild(document.createTextNode(etiqueta));
        opcion.type = 'button';
        opcion.disabled = pendiente || !pedidoReal.length || !sesionPos;
        opcion.classList.toggle('active', medioSimulado === clave);
        opcion.setAttribute('aria-pressed', medioSimulado === clave);
        opcion.onclick = function () {
          medioSimulado = clave;
          actualizarPedidoSimulado();
          el('payments').querySelector('.active').focus();
        };
        el('payments').append(opcion);
      });
    }
    el('checkout').textContent = pendiente ? 'Reintentar confirmación'
      : simulacionActiva ? 'Confirmar venta simulada' : 'Cobro deshabilitado';
    el('checkout').disabled = !simulacionActiva || !sesionPos || enviandoVenta
      || (!pendiente && (!validacionPos || !medioSimulado));
    el('cardsReal').inert = pendiente;
    el('lines').inert = pendiente;
    el('catalogMode').disabled = pendiente;
    el('clearCart').disabled = pendiente || !pedidoReal.length;

    var totalValidado = ventaPendiente?.datos.total_esperado_centavos ?? validacionPos?.total;
    el('totalLabel').textContent = totalValidado === undefined ? 'Total estimado' : 'Total validado';
    if (totalValidado !== undefined) el('total').textContent = importePos(totalValidado);
  }

  var validandoRevision = null;
  el('validarPedido').onclick = async function () {
    var revision = revisionPedidoReal;
    var estado = el('estadoPedido');
    var items = pedidoReal.map(item => ({
      id_producto: item.id_producto,
      cantidad: item.cantidad,
      ingredientes_quitados: item.ingredientes_quitados,
      ids_adicionales: item.adicionales.map(extra => extra.id_adicional_catalogo),
      ...(item.papas_dobles ? {papas_dobles: true} : {}),
      ...(item.observacion ? {observacion: item.observacion} : {}),
      ...(item.adicionales_preparacion?.length ? {adicionales_preparacion: item.adicionales_preparacion
        .map(({tipo, destino, cantidad}) => ({tipo, destino, cantidad}))} : {})
    }));
    validacionPos = null;
    validandoRevision = revision;
    actualizarPedidoSimulado();
    estado.textContent = 'Validando precios y stock…';
    try {
      var datos = await enviarPos('/pedidos/validar', {items});
      if (revision !== revisionPedidoReal) return;
      validacionPos = {items, total: datos.total_centavos};
      estado.textContent = 'Total validado por el servidor: ' + importePos(datos.total_centavos) + '.';
      if (datos.descuento_centavos) {
        estado.textContent += ' Descuento por postres chicos: ' + importePos(datos.descuento_centavos) + '.';
      }
    } catch (error) {
      if (revision !== revisionPedidoReal) return;
      if (error.status === 401) await actualizarSesionPos();
      estado.textContent = error.status === 401 ? 'Iniciá sesión en el POS para validar el pedido.'
        : error.status ? error.message : 'No se pudo validar el pedido.';
    } finally {
      if (validandoRevision === revision) validandoRevision = null;
      if (revision === revisionPedidoReal) actualizarPedidoSimulado();
    }
  };

  async function refrescarStockPos() {
    try {
      var respuesta = await fetch('/pos-api/catalogo/productos', {cache: 'no-store', signal: senalTiempoPos(12000)});
      if (!respuesta.ok) throw new Error('Catálogo no disponible');
      var datos = await respuesta.json();
      if (!modoReal || !Array.isArray(datos.productos)) return;
      productosReales = datos.productos;
      mostrarCatalogoReal();
    } catch (error) {
      if (modoReal) el('apiStatus').textContent = 'No se pudo actualizar el stock en pantalla. Recargá el catálogo.';
    }
  }

  async function confirmarVentaPendiente() {
    if (enviandoVenta || !ventaPendiente || !sesionPos) return;
    var usuario = sesionPos;
    enviandoVenta = true;
    actualizarPedidoSimulado();
    el('estadoPedido').textContent = 'Confirmando venta simulada…';
    el('notice').textContent = '';
    try {
      var venta = await enviarPos('/simulacion/ventas', ventaPendiente.datos, usuario);
      if (venta.simulacion !== true || !venta.id_venta) throw new Error('Respuesta inesperada');
      sessionStorage.removeItem(clavePendiente(usuario));
      ventaPendiente = null;
      pedidoReal = [];
      medioSimulado = '';
      mostrarPedidoReal();
      el('notice').textContent = 'Venta simulada #' + venta.id_venta + (venta.anulada ? ' anulada' : ' registrada')
        + ' · ' + importePos(venta.total_centavos) + (venta.deudor
          ? ' · Saldo pendiente ' + importePos(venta.saldo_pendiente_centavos)
          : ' · ' + (mediosSimulados[venta.medio_pago] || 'Pago combinado')) + '.';
      void refrescarStockPos();
    } catch (error) {
      if (error.status === 422 || ['PEDIDO_RECHAZADO', 'TOTAL_MODIFICADO', 'PAGO_RECHAZADO'].includes(error.codigo)) {
        sessionStorage.removeItem(clavePendiente(usuario));
        ventaPendiente = null;
        mostrarPedidoReal();
        el('estadoPedido').textContent = error.message + ' Revisá el pedido y validalo de nuevo.';
      } else {
        if (error.status === 401 || error.codigo === 'SESION_CAMBIADA') await actualizarSesionPos();
        el('estadoPedido').textContent = (error.status ? error.message + ' ' : 'No se pudo confirmar el resultado. ')
          + 'Reintentá desde esta pestaña para consultar la misma venta.';
      }
    } finally {
      enviandoVenta = false;
      if (modoReal) actualizarPedidoSimulado();
    }
  }

  const rutaClientesPos = '/simulacion/clientes';

  function etiquetaClientePos(cliente) {
    return cliente.nombre + ' · #' + cliente.id_cliente +
      (cliente.referencia ? ' · ' + cliente.referencia : '') +
      (cliente.telefono ? ' · ' + cliente.telefono : '');

  function campoClientePos(campos, etiqueta, maximo, id) {
    const label = nodoPos('label', etiqueta + ' ');
    const input = nodoPos('input');
    input.maxLength = maximo;
    if (id) input.id = id;
    label.append(input);
    campos.append(label);

  function camposAltaClientePos(campos) {
    const nombre = campoClientePos(campos, 'Nombre o apodo', 120, 'nombreClientePos');
    const telefono = campoClientePos(campos, 'Teléfono', 60);
    const referencia = campoClientePos(campos, 'Referencia', 300);
    return () => {
      if (!nombre.value.trim()) throw new Error('Ingresá un nombre o apodo.');
      return {nombre: nombre.value.trim(), telefono: telefono.value.trim() || null,
        referencia: referencia.value.trim() || null};
    };

  function buscarClientePos(campos, usuario, elegir) {
    const termino = campoClientePos(campos, 'Nombre, ID, teléfono o referencia', 300, 'buscarClientePos');
    const buscar = nodoPos('button', 'Buscar');
    buscar.type = 'button';
    const lista = nodoPos('div');
    lista.setAttribute('aria-live', 'polite');
    campos.append(buscar, lista);
    buscar.onclick = async () => {
      buscar.disabled = true;
      lista.textContent = 'Buscando…';
      try {
        const datos = await consultarPos(rutaClientesPos + '?q=' + encodeURIComponent(termino.value));
        if (sesionPos !== usuario) return;
        lista.replaceChildren();
        for (const cliente of datos.clientes) {
          const boton = nodoPos('button', etiquetaClientePos(cliente));
          boton.type = 'button';
          boton.onclick = () => elegir(cliente);
          lista.append(boton);
        }
        if (!datos.clientes.length) lista.textContent = 'Sin coincidencias.';
      } catch (error) {
        lista.textContent = error.message;
      } finally {
        buscar.disabled = false;
      }
    };
    return buscar;
  }

  function elegirClienteFiadoPos(campos, usuario, obligatorio = true) {
    let cliente;
    const elegido = nodoPos('p', obligatorio ? 'Seleccioná o registrá un cliente para confirmar la deuda.'
      : 'Seleccioná un cliente para vincularlo con la venta.');
    elegido.id = 'clienteElegidoPos';
    elegido.setAttribute('aria-live', 'polite');
    campos.append(elegido);
    function elegir(datos) {
      cliente = datos;
      elegido.textContent = etiquetaClientePos(datos);
    }
    buscarClientePos(campos, usuario, elegir);
    const alta = nodoPos('details');
    alta.append(nodoPos('summary', 'Alta rápida'));
    const leer = camposAltaClientePos(alta);
    const registrar = nodoPos('button', 'Guardar y seleccionar');
    registrar.type = 'button';
    registrar.id = 'altaRapidaClientePos';
    const errorEl = nodoPos('p');
    errorEl.setAttribute('role', 'alert');
    let pendiente;
    registrar.onclick = async () => {
      if (sesionPos !== usuario) return;
      errorEl.textContent = '';
      registrar.disabled = true;
      try {
        pendiente ||= {...leer(), id_solicitud: uuidPos()};
        elegir(await enviarPos(rutaClientesPos, pendiente, usuario));
        pendiente = null;
        alta.open = false;
      } catch (error) {
        if ([409, 422].includes(error.status) && error.codigo !== 'SESION_CAMBIADA') pendiente = null;
        errorEl.textContent = error.message;
      } finally {
        registrar.disabled = false;
      }
    };
    alta.append(registrar, errorEl);
    campos.append(alta);
    return () => {
      if (obligatorio && !cliente) throw new Error('Seleccioná un cliente registrado.');

  function mostrarClientesPos() {
    const usuario = sesionPos;
    if (!usuario) return;
    const panel = abrirConsultaPos('Clientes y cuentas corrientes');
    buscarClientePos(panel, usuario, cliente => mostrarFichaClientePos(cliente.id_cliente));
    const alta = nodoPos('button', 'Nuevo cliente');

  function abrirPagoClientePos(ficha, usuario) {
    const ruta = rutaClientesPos + '/' + ficha.id_cliente + '/abonos';
    abrirOperacionPos('Abono de ' + etiquetaClientePos(ficha), ruta, usuario, campos => {
      const medios = selectorPos('Medio', mediosSimulados);
      const receptores = selectorPos('Receptor real', receptoresPos(medios.select.value));
      medios.select.onchange = () => {
        const opciones = selectorPos('Receptor real', receptoresPos(medios.select.value));
        receptores.select.replaceChildren(...opciones.select.options);
      };
      const monto = importeEntradaPos('Importe en pesos');
      const referencia = campoClientePos(campos, 'Referencia de pago', 120);
      campos.prepend(medios.label, receptores.label, monto.label);
      const prever = nodoPos('button', 'Ver distribución FIFO');
      prever.type = 'button';
      prever.id = 'preverAbonoClientePos';
      const resumen = nodoPos('div');
      resumen.id = 'distribucionAbonoClientePos';
      resumen.setAttribute('aria-live', 'polite');
      campos.append(prever, resumen);
      const leerPago = () => ({medio_pago: medios.select.value, receptor: receptores.select.value,
        importe_centavos: leerCentavosPos(monto.input.value), referencia: referencia.value.trim() || null});
      let vista;
      let pagoPrevio;
      prever.onclick = async () => {
        vista = null;
        prever.disabled = true;
        resumen.textContent = 'Calculando…';
        try {
          pagoPrevio = leerPago();
          vista = await enviarPos(ruta + '/vista-previa', pagoPrevio, usuario);
          resumen.replaceChildren();
          for (const parte of vista.imputaciones) {
            resumen.append(nodoPos('p', 'Venta #' + parte.id_venta + ' · ' + importePos(parte.importe_centavos)
              + ' · ' + Object.entries(parte.por_seccion_centavos)
                .map(([seccion, importe]) => nombresCajas[seccion] + ' ' + importePos(importe)).join(' · ')));
          }
        } catch (error) {
          resumen.textContent = error.message;
        } finally {
          prever.disabled = false;
        }
      };
      return () => {
        const pago = leerPago();
        if (!vista || JSON.stringify(pago) !== JSON.stringify(pagoPrevio)) {
          throw new Error('Consultá la distribución antes de confirmar el abono.');
        }
        return {pago, vista_previa: vista.vista_previa};
      };
    }, () => mostrarFichaClientePos(ficha.id_cliente, 'Abono registrado.'));

      for (const [seccion, saldo] of Object.entries(ficha.saldo_por_seccion_centavos)) {
        panel.append(nodoPos('p', nombresCajas[seccion] + ' · ' + importePos(saldo)));

          + ' · Saldo ' + importePos(venta.saldo_pendiente_centavos)));
        for (const item of venta.items) detalle.append(nodoPos('p', item.cantidad + ' × ' + item.producto));
        for (const evento of venta.historial) {
          detalle.append(nodoPos('p', fechaPos(evento.fecha) + ' · ' + evento.tipo
            + (evento.motivo ? ' · ' + evento.motivo : '')));
          for (const mov of evento.movimientos) {
            detalle.append(nodoPos('p', nombreReceptorPos(mov.receptor) + ' · ' + importePos(mov.importe_centavos)));
          }
        }
        panel.append(detalle);
      }
      panel.append(nodoPos('h3', 'Abonos globales y correcciones'));
      const corregidos = new Set(ficha.operaciones.filter(op => op.tipo === 'correccion').map(op => op.uuid_abono));
      for (const op of ficha.operaciones) {
        const detalle = nodoPos('details');
        detalle.append(nodoPos('summary', fechaPos(op.fecha) + ' · '
          + (op.tipo === 'abono' ? 'Abono ' + importePos(op.pago.importe_centavos) : 'Corrección · ' + op.motivo)));
        if (op.tipo === 'abono') {
          detalle.append(nodoPos('p', nombreReceptorPos(op.pago.receptor)));
          for (const parte of op.imputaciones) {
            detalle.append(nodoPos('p', 'Venta #' + parte.id_venta + ' · ' + importePos(parte.importe_centavos)));
          }
          if (sesionAdmin && !corregidos.has(op.uuid)) {
            const corregir = nodoPos('button', 'Corregir abono');
            corregir.onclick = () => abrirOperacionPos('Corregir abono', ruta + '/abonos/' + op.uuid + '/correccion',
              usuario, campos => {
                const motivo = motivoOperacionPos(campos);
                return () => ({motivo: motivo()});
              }, () => mostrarFichaClientePos(id, 'Corrección registrada.'));
            detalle.append(corregir);
          }
        }
        panel.append(detalle);
      }

      panel.textContent = error.message;
    }

  el('clientesPos').onclick = mostrarClientesPos;


  function camposSeguimientoPos(contenedor, obligatorio = false) {
    const opciones = {retiro: 'Retiro en local', envio: 'Envío a domicilio'};
    const modalidad = selectorPos('Seguimiento', obligatorio ? opciones : {'': 'Venta rápida', ...opciones});
    const origen = selectorPos('Origen', {mostrador: 'Mostrador', whatsapp: 'WhatsApp'});
    const titular = selectorPos('Importe del envío para', {repartidor: 'Repartidor', negocio: 'Negocio'});
    function texto(etiqueta, limite) {
      const label = nodoPos('label', etiqueta + ' ');
      const input = nodoPos('input');
      input.maxLength = limite;
      label.append(input);
      return {label, input};
    }
    const direccion = texto('Dirección', 250);
    const referencias = texto('Referencias de llegada', 300);
    const observacion = texto('Observación del pedido', 300);
    const costo = texto('Importe de envío', 20);
    costo.input.inputMode = 'decimal';
    const datos = nodoPos('div');
    const datosEnvio = nodoPos('div');
    datosEnvio.append(direccion.label, referencias.label, titular.label, costo.label);
    datos.append(origen.label, observacion.label, datosEnvio);
    contenedor.prepend(modalidad.label, datos);
    function actualizar() {
      datos.hidden = !modalidad.select.value;
      datosEnvio.hidden = modalidad.select.value !== 'envio';
    }
    modalidad.select.addEventListener('change', actualizar);
    actualizar();
    return function leer() {
      const modo = modalidad.select.value;
      if (!modo) return {};
      const entrega = {origen: origen.select.value, modalidad: modo, observacion: observacion.input.value.trim() || null};
      if (modo !== 'envio') return {entrega};
      if (!direccion.input.value.trim()) throw new Error('Ingresá la dirección del envío.');
      entrega.direccion = direccion.input.value.trim();
      entrega.referencias = referencias.input.value.trim() || null;
      if (!costo.input.value.trim()) return {entrega};
      const importe = leerCentavosPos(costo.input.value, true);
      return importe ? {entrega, envio: {titular: titular.select.value, importe_centavos: importe}} : {entrega};
    };
  }

  el('guardarPedidoAnonimo').onclick = function () {

    if (!usuario || (!validacion && !hayOperacionPos('/simulacion/pedidos', usuario))) return;
    abrirOperacionPos('Guardar pedido sin venta', '/simulacion/pedidos', usuario, campos => {
      const leer = camposSeguimientoPos(campos, true);
      return () => {
        if (validacion !== validacionPos) throw new Error('El carrito cambió. Volvé a validarlo.');
        return {items: validacion.items, ...leer()};
      };

      if (validacion === validacionPos) {

        medioSimulado = '';

  async function prepararConversionPos(pedido, usuario) {
    const ruta = '/simulacion/pedidos/' + pedido.id_pedido + '/venta';
    const consulta = el('consultaPos');
    let total;
    if (!hayOperacionPos(ruta, usuario)) {
      try {
        const respuesta = await fetch('/pos-api/simulacion/pedidos/' + pedido.id_pedido + '/cotizacion',
          {cache: 'no-store', signal: senalTiempoPos(12000)});
        const cuerpo = await respuesta.json();
        if (!respuesta.ok) throw new Error(typeof cuerpo.detail === 'string' ? cuerpo.detail : 'Revisá el pedido.');
        total = cuerpo.total_centavos;
      } catch (error) {
        if (consulta?.isConnected) consulta.prepend(nodoPos('p', error.message, 'notice'));
        return;
      }
    }
    if (!consulta?.isConnected || sesionPos !== usuario) return;
    abrirOperacionPos('Confirmar venta · Pedido #' + pedido.id_pedido, ruta, usuario, campos => {
      campos.append(nodoPos('p', 'Total vigente ' + importePos(total)));
      if (total !== pedido.total_estimado_centavos) {
        campos.append(nodoPos('p', 'Estimación original ' + importePos(pedido.total_estimado_centavos)));
      }
      const medio = selectorPos('Medio', {...mediosSimulados, combinado: 'Pago combinado', fiado: 'Fiado'});
      const receptor = selectorPos('Receptor', {});
      const combinado = nodoPos('div');
      const cliente = nodoPos('div');
      const leerPagos = editarPagosPos(combinado, 0, null, 0);
      const leerCliente = clientesActivos ? elegirClienteFiadoPos(cliente, usuario, false) : () => undefined;
      campos.append(medio.label, receptor.label, combinado, cliente);
      function actualizar() {
        const valor = medio.select.value;
        receptor.label.hidden = valor === 'combinado' || valor === 'fiado';
        combinado.hidden = !receptor.label.hidden;
        cliente.hidden = valor !== 'fiado';
        receptor.select.replaceChildren(new Option('Por sección', ''), ...Object.entries(receptoresPos(valor))
          .map(([clave, etiqueta]) => new Option(etiqueta, clave)));
      }
      medio.select.onchange = actualizar;
      actualizar();
      return () => {
        const valor = medio.select.value;
        const datos = {total_esperado_centavos: total};
        if (valor === 'fiado' || valor === 'combinado') {
          datos.pagos = leerPagos();
          if (valor === 'fiado') {
            datos.fiado = true;
            datos.id_cliente = leerCliente();
            if (!datos.id_cliente) throw new Error('Seleccioná un cliente registrado.');
          }
        } else if (receptor.select.value) {
          datos.pagos = [{receptor: receptor.select.value, medio_pago: valor, importe_centavos: total}];
        } else datos.medio_pago = valor;
        return datos;
      };
    }, venta => {
      void refrescarStockPos();
      mostrarSeguimientoPos(pedido.estado === 'entregado');
      el('notice').textContent = 'Venta #' + venta.id_venta + ' registrada para el pedido #' + pedido.id_pedido + '.';
    });
  }

  function prepararVentaSimulada() {
    if (!simulacionActiva || !sesionPos || enviandoVenta) return;
    if (ventaPendiente) {
      void confirmarVentaPendiente();
      return;
    }
    if (!validacionPos || !medioSimulado) return;

    var usuario = sesionPos;
    var validacion = validacionPos;
    var medio = medioSimulado;
    el('dialogBody').onchange = null;
    show('Confirmar venta simulada', '<p id="resumenVentaPos" class="check"></p>' +
      '<p class="muted">Se actualizarán el stock y las cajas ficticias.</p>' +
      '<p id="errorVentaPos" role="alert"></p>', 'Registrar venta simulada');
    el('resumenVentaPos').textContent = importePos(validacion.total) + ' · ' + modalidadesSimuladas[medio];
    var errorVenta = el('errorVentaPos');
    var campos = nodoPos('div');
    errorVenta.before(campos);
    const leerSeguimiento = el('entrenamientoAviso') ? camposSeguimientoPos(campos) : () => ({});
    function cargoEnvio() {
      try {
        return leerSeguimiento().envio;
      } catch (_) {
        return undefined;
      }
    }
    campos.addEventListener('input', actualizarTotalEnvio);
    campos.addEventListener('change', actualizarTotalEnvio);
    function actualizarTotalEnvio() {
      const envio = cargoEnvio();
      const adicional = envio ? ' · Envío para ' + envio.titular + ': ' + importePos(envio.importe_centavos) : '';
      el('resumenVentaPos').textContent = importePos(validacion.total + (envio?.importe_centavos || 0))
        + ' · ' + modalidadesSimuladas[medio] + adicional;
    }
    var leerPagos;
    var deudor;
    var leerCliente;
    var receptor;
    if (medio === 'combinado' || medio === 'fiado') {
      if (medio === 'fiado' && el('entrenamientoAviso')) {
        if (!clientesActivos) {
          errorVenta.textContent = 'Activá Clientes para registrar nuevas ventas fiadas.';
          el('accept').disabled = true;
          return;
        }
        leerCliente = elegirClienteFiadoPos(campos, usuario);
      } else if (medio === 'fiado') {
        var label = nodoPos('label', 'Cliente o identificador ');
        deudor = nodoPos('input');
        deudor.maxLength = 120;
        label.append(deudor);
        campos.append(label);
      }
      var resumen = nodoPos('p');
      resumen.setAttribute('aria-live', 'polite');
      campos.append(resumen);
      function actualizarSaldo() {
        try {
          var pagos = leerPagos ? leerPagos() : [];
          var cobrado = pagos.reduce((total, pago) => total + pago.importe_centavos, 0);
          const envio = cargoEnvio();
          const totalPropio = validacion.total + (envio?.titular === 'negocio' ? envio.importe_centavos : 0);
          resumen.textContent = cobrado > totalPropio ? 'Los pagos superan el total.'
            : 'Cobrado ' + importePos(cobrado) + ' · Saldo ' + importePos(totalPropio - cobrado);
        } catch (error) {
          resumen.textContent = 'Completá los importes para calcular el saldo.';
        }
      }
      leerPagos = editarPagosPos(campos, 0, actualizarSaldo, medio === 'fiado' ? 0 : 2);
      actualizarSaldo();
    } else {
      receptor = selectorPos('Receptor', {'': 'Distribuir según la sección de cada producto', ...receptoresPos(medio)});
      campos.append(receptor.label);
    }
    if (medio !== 'fiado' && clientesActivos && el('entrenamientoAviso')) {
      const clienteOpcional = nodoPos('details');
      clienteOpcional.append(nodoPos('summary', 'Asociar cliente (opcional)'));
      leerCliente = elegirClienteFiadoPos(clienteOpcional, usuario, false);
      campos.append(clienteOpcional);
    }
    el('accept').onclick = function () {
      if (enviandoVenta || ventaPendiente || sesionPos !== usuario || validacionPos !== validacion) return;
      try {
        const seguimiento = leerSeguimiento();
        const totalVenta = validacion.total + (seguimiento.envio?.titular === 'negocio'
          ? seguimiento.envio.importe_centavos : 0);
        var modalidad = {medio_pago: medio};
        if (leerPagos) {
          var pagos = leerPagos();
          var cobrado = pagos.reduce((total, pago) => total + pago.importe_centavos, 0);
          var fiado = medio === 'fiado';
          if (cobrado > totalVenta || (fiado ? cobrado === totalVenta : cobrado !== totalVenta)) {
            throw new Error(fiado ? 'El fiado debe dejar un saldo pendiente.' : 'Los pagos deben cubrir el total.');
          }
          if (fiado && !leerCliente && !deudor.value.trim()) throw new Error('Ingresá el cliente o identificador.');
          modalidad = {pagos, fiado, deudor: deudor?.value.trim() || null};
          if (fiado && leerCliente) modalidad.id_cliente = leerCliente();
        } else if (receptor.select.value) {
          modalidad = {pagos: [{medio_pago: medio, receptor: receptor.select.value, importe_centavos: totalVenta}]};
        }
        if (medio !== 'fiado' && leerCliente) modalidad.id_cliente = leerCliente();
        var pendiente = {
          pedido: pedidoReal,
          datos: {
            items: validacion.items,
            id_solicitud: uuidPos(),
            total_esperado_centavos: totalVenta,
            ...seguimiento,
            ...modalidad
          }
        };
        sessionStorage.setItem(clavePendiente(usuario), JSON.stringify(pendiente));
        ventaPendiente = pendiente;
      } catch (error) {
        errorVenta.textContent = error.message || 'No se pudo guardar la confirmación en esta pestaña.';
        return;
      }
      close();
      void confirmarVentaPendiente();
    };
  }


  el('checkout').onclick = function () {
    if (modoReal) {
      prepararVentaSimulada();
      return;
    }
    el('dialogBody').onchange = null;
    var sums = totals();
    show('Confirmar cobro de prueba','<p class="check">' + method + ' · ' + money(sums.total) + '</p><p class="muted">La simulación finaliza este pedido sin procesar un pago.</p>','Confirmar simulación');
    el('accept').onclick = function () {
      var confirmation = 'Cobro simulado por ' + money(sums.total) + ' · ' + method + '.';
      cart = []; method = ''; close(); order();
      el('notice').textContent = confirmation;
      el('tabs').querySelector('.active').focus();
    };
  };
  document.addEventListener('click',function (event) {
    var target = event.target;
    while (target && target !== document && target.tagName !== 'BUTTON') target = target.parentNode;
    if (!target || target === document) return;
    function value(name) { return target.getAttribute('data-' + name); }
    if (target.id === 'cancel') close();
    else if (value('category') !== null) { category = value('category'); el('search').value = ''; menu(); el('tabs').querySelector('.active').focus(); }
    else if (value('product') !== null) customize(-1,catalog[category][Number(value('product'))]);
    else if (value('edit') !== null) customize(Number(value('edit')));
    else if (value('remove') !== null) { cart.splice(Number(value('remove')),1); order(); el('lines').querySelector('button') ? el('lines').querySelector('button').focus() : el('tabs').querySelector('.active').focus(); }
    else if (value('copy') !== null) {
      var index = Number(value('copy')), item = cart[index];
      cart.splice(index+1,0,{product:item.product,category:item.category,removed:item.removed.slice(),added:item.added.slice()}); order();
      el('lines').querySelector('[data-edit="' + (index+1) + '"]').focus();
    }
    else if (value('payment') !== null) { method = value('payment'); order(); el('payments').querySelector('.active').focus(); }
  });
  document.addEventListener('keydown',function (event) {
    if (overlay.hidden) return;
    if (event.key === 'Escape' || event.keyCode === 27) { close(); return; }
    if (event.key !== 'Tab' && event.keyCode !== 9) return;
    var controls = Array.from(overlay.querySelectorAll('input,textarea,select,button,summary'))
      .filter(control => !control.disabled && control.getClientRects().length);
    if (event.shiftKey && document.activeElement === controls[0]) { event.preventDefault(); controls[controls.length-1].focus(); }
    if (!event.shiftKey && document.activeElement === controls[controls.length-1]) { event.preventDefault(); controls[0].focus(); }
  });
   
    menu();
    order();

    async function iniciarPos() {
      el('nuevaVentaPos').onclick = el('search').onfocus = function () {
        el('tabletCartState').checked = false;
      };
      try {
        var estadoSimulacion = await consultarPos('/simulacion/estado');
        simulacionActiva = estadoSimulacion.simulacion === true;
        clientesActivos = estadoSimulacion.clientes === true;
        cajaDiariaActiva = estadoSimulacion.caja_diaria === true;
        contabilidadActiva = estadoSimulacion.contabilidad === true;
      } catch (error) {
        simulacionActiva = false;
        clientesActivos = false;
        cajaDiariaActiva = false;
        contabilidadActiva = false;
      }
      el('simulationBanner').hidden = !simulacionActiva;
      await actualizarSesionPos();
      if (simulacionActiva && !modoReal) el('catalogMode').click();
    }

    iniciarPos().then(function () {
      if (simulacionActiva) return;
      return fetch('/pos-api/catalogo/productos')
    .then(function (respuesta) {
        if (!respuesta.ok) {
        throw new Error('Error HTTP ' + respuesta.status);
        }

        return respuesta.json();
    })
    .then(function (datos) {
        if (!datos.ok || !Array.isArray(datos.productos)) {
        throw new Error('Respuesta de catálogo inválida');
        }

        el('apiStatus').textContent =
        'Conectado a Abadion: ' +
        datos.productos.length +
        ' productos disponibles. Catálogo visual en modo demo.';

        var panel = document.createElement('details');
        panel.className = 'offer';

        var titulo = document.createElement('summary');
        titulo.textContent = 'Ver catálogo de SQLite (' +
        datos.productos.length + ' productos)';

        panel.appendChild(titulo);

        datos.productos.forEach(function (producto) {
        var fila = document.createElement('p');
        fila.className = 'muted';
        fila.style.padding = '6px 0';

        var precio = typeof producto.precio_venta === 'number'
            ? money(producto.precio_venta)
            : 'Sin precio';

        fila.textContent =
            producto.nombre + ' · ' +
            producto.categoria + ' · ' + precio;

        panel.appendChild(fila);
        });

        el('apiStatus').insertAdjacentElement('afterend', panel);

    })
    .catch(function (error) {
        el('apiStatus').textContent =
        'No se pudo conectar con el catálogo de Abadion.';

        console.error(error);
    });
    });

}());
</script>
</body>
</html>
