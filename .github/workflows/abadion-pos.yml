name: Verificación de Abadion POS

on:
  pull_request:
  push:
    branches:
      - feature/abadion-pos-integracion-contable
      - feature/abadion-pos-cierre-diario
      - feature/abadion-pos-integracion-definitiva

permissions:
  contents: read

jobs:
  sqlite-ficticio:
    runs-on: ubuntu-latest
    env:
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -r requirements-tablet-test.txt
      - run: python -m pytest -q
        env:
          NEGOCIO_DB_PATH: ${{ runner.temp }}/abadion-ci-ficticio.db
      - run: node --check whatsapp-bot/index.js

  pos-edge:
    runs-on: windows-latest
    env:
      PYTHON_DOTENV_DISABLED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-tablet-test.txt
      - name: Verificar candidata bloqueada y permisos Windows
        run: python -m pytest -q tests/test_produccion_candidata.py
      - name: Verificar el POS ficticio en Edge
        shell: pwsh
        run: |
          $env:NEGOCIO_DB_PATH = Join-Path $env:RUNNER_TEMP 'abadion-edge-ficticio.db'
          $env:POS_TEST_BROWSER = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path -LiteralPath $env:POS_TEST_BROWSER)) {
            throw 'No se encontró Microsoft Edge.'
          }
          $env:POS_UI_CAPTURAS = Join-Path $env:RUNNER_TEMP 'abadion-capturas'
          python -m pytest -q tests/test_pos_web.py tests/test_demo_tablet.py tests/test_tablet_https.py tests/test_preproduccion.py tests/test_preproduccion_consolidacion.py tests/test_preproduccion_catalogo_edge.py tests/test_preproduccion_jornada_v1.py tests/test_lo_de_clau_delivery.py tests/test_lo_de_clau_edge.py tests/test_catalogo_comercial.py tests/test_abadion_pruebas.py tests/test_fiado_directo.py tests/test_saldo_unificado.py tests/test_preparacion_unificada.py tests/test_espera_cierre.py
      - name: Publicar capturas del flujo de ventas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abadion-preproduccion-edge
          path: ${{ runner.temp }}/abadion-capturas/abadion-paso-*.png
          if-no-files-found: warn
